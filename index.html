            if (it.end) {
              var s = api.couple.start_date ? NC.daysBetween(NC.parseDate(api.couple.start_date), NC.today()) : 0;
              return '<div class="reel-end">' + NC.heart3d(110) + '<h2 class="script">E a nossa história continua…</h2>' +
                (s > 0 ? '<p>' + s.toLocaleString('pt-BR') + ' dias e contando ❤️</p>' : '') + '</div>';
            }
            return '<figure class="reel-photo"><img src="' + esc(api.urlFor(it.path)) + '" alt="' + esc(it.title || 'Lembrança') + '">' +
              '<figcaption><span class="reel-date">' + esc(NC.fmtDate(it.date)) + (it.tag ? ' · ' + esc(it.tag) : '') + '</span>' +
              (it.title ? '<strong>' + esc(it.title) + '</strong>' : '') +
              (it.text ? '<span class="reel-text">' + esc(it.text) + '</span>' : '') + '</figcaption></figure>';
          }
          function show(i, dir) {
            idx = (i + items.length) % items.length;
            var old = stage.querySelector('.reel-card:not(.out)');
            var card = document.createElement('div');
            card.className = 'reel-card in ' + (dir < 0 ? 'from-left' : 'from-right');
            card.innerHTML = cardHTML(items[idx]);
            stage.appendChild(card);
            if (old) { old.classList.add('out'); old.classList.add(dir < 0 ? 'to-right' : 'to-left'); setTimeout(function () { old.remove(); }, 900); }
            $('#reel-count', c.el).textContent = (idx + 1) + ' / ' + items.length;
            arm();
            var nx = items[(idx + 1) % items.length];
            if (nx && nx.path) { var pre = new Image(); pre.src = api.urlFor(nx.path); }
          }
          /* reinicia a barra de progresso e o relógio da próxima foto */
          function arm() {
            var prog = $('#reel-progress', c.el);
            prog.style.transition = 'none'; prog.style.width = '0%';
            void prog.offsetWidth;
            clearTimeout(tm);
            if (playing) {
              prog.style.transition = 'width 5s linear'; prog.style.width = '100%';
              tm = setTimeout(function () { if (!dead) show(idx + 1, 1); }, 5000);
            }
          }
          function setPlaying(v) {
            playing = v;
            $('#reel-play', c.el).innerHTML = icon(v ? 'pause' : 'play');
            $('#reel-play', c.el).setAttribute('aria-label', v ? 'Pausar' : 'Continuar');
            arm();
          }
          $('#reel-prev', c.el).addEventListener('click', function () { show(idx - 1, -1); });
          $('#reel-next', c.el).addEventListener('click', function () { show(idx + 1, 1); });
          $('#reel-play', c.el).addEventListener('click', function () { setPlaying(!playing); });
          var sx = null;
          stage.addEventListener('pointerdown', function (e) { sx = e.clientX; });
          stage.addEventListener('pointerup', function (e) {
            if (sx == null) return;
            var dx = e.clientX - sx; sx = null;
            if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
          });
          show(0, 1);
        }
      });
      function onKey(e) {
        if (!document.body.contains(ctl.el)) return;
        if (e.key === 'ArrowRight') $('#reel-next', ctl.el).click();
        else if (e.key === 'ArrowLeft') $('#reel-prev', ctl.el).click();
        else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('#reel-play', ctl.el).click(); }
      }
      document.addEventListener('keydown', onKey);
    }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
  }
})();

/* ===== js/views/calendar.js ===== */
/* Nosso calendário de amor: eventos com foto, categorias e contagem regressiva. */
(function () {
  'use strict';
  var NC = window.NC, api = NC.api, $ = NC.$, esc = NC.esc, icon = NC.icon;

  var CATS = [
    { id: 'aniversario_namoro', label: 'Aniversário de namoro', color: '#ff4d88', repeat: true },
    { id: 'primeiro_encontro', label: 'Primeiro encontro', color: '#ffa94d', repeat: true },
    { id: 'primeiro_beijo', label: 'Primeiro beijo', color: '#ff7a7a', repeat: true },
    { id: 'aniversario_pessoal', label: 'Aniversário pessoal', color: '#b794ff', repeat: true },
    { id: 'viagem', label: 'Viagem ou passeio', color: '#4dd4ff', repeat: false },
    { id: 'surpresa', label: 'Surpresa', color: '#ffd24d', repeat: false },
    { id: 'especial', label: 'Data especial', color: '#ff4dd2', repeat: false },
    { id: 'outro', label: 'Outro momento', color: '#9aa5ff', repeat: false }
  ];
  NC.CATS = CATS;
  NC.catMeta = function (id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
    return CATS[CATS.length - 1];
  };

  var MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var WEEK = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var cur = { y: null, m: null };
  var rootEl = null;

  function heart(color, cls) {
    return '<span class="heart-dot ' + (cls || '') + '" style="color:' + color + '">' + NC.heartSVG('currentColor') + '</span>';
  }

  /* ocorrências do mês exibido, agrupadas por dia (AAAA-MM-DD) */
  function monthMap(events, y, m) {
    var map = {};
    events.forEach(function (ev) {
      var d = NC.occurrenceInYear(ev, y);
      if (d && d.getMonth() === m) {
        var k = NC.toISO(d);
        (map[k] = map[k] || []).push({ ev: ev, date: d });
      }
    });
    return map;
  }

  function gridHTML(map, y, m) {
    var first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
    var todayS = NC.todayStr();
    var h = WEEK.map(function (w) { return '<div class="cal-wd" aria-hidden="true">' + w + '</div>'; }).join('');
    for (var b = 0; b < first.getDay(); b++) h += '<div class="day empty" aria-hidden="true"></div>';
    for (var d = 1; d <= days; d++) {
      var iso = NC.toISO(new Date(y, m, d));
      var list = map[iso] || [];
      var label = d + ' de ' + MONTHS[m].toLowerCase() + (list.length ? ', ' + NC.plural(list.length, 'evento', 'eventos') : '');
      var hearts = list.slice(0, 3).map(function (o) { return heart(NC.catMeta(o.ev.category).color); }).join('') +
        (list.length > 3 ? '<span class="more">+' + (list.length - 3) + '</span>' : '');
      var special = list.some(function (o) { return o.ev.category === 'aniversario_namoro'; });
      h += '<button type="button" class="day' + (iso === todayS ? ' today' : '') + (list.length ? ' has' : '') + (special ? ' special' : '') +
        '" data-date="' + iso + '" aria-label="' + esc(label) + '"><span class="day-num">' + d + '</span><span class="day-hearts">' + hearts + '</span></button>';
    }
    return h;
  }

  function upcoming(events) {
    var out = [];
    events.forEach(function (ev) {
      var d = NC.nextOccurrence(ev);
      if (d) out.push({ ev: ev, date: d });
    });
    out.sort(function (a, b) { return a.date - b.date; });
    return out;
  }

  function evRow(o, showCountdown) {
    var cat = NC.catMeta(o.ev.category);
    return '<li><button type="button" class="ev-row" data-ev="' + o.ev.id + '">' +
      heart(cat.color) +
      '<span class="ev-main"><strong>' + esc(o.ev.title) + '</strong>' +
      '<span class="muted small">' + esc(NC.fmtDate(o.date)) + ' · ' + esc(cat.label) + '</span></span>' +
      (showCountdown ? '<span class="pill">' + esc(NC.countdownText(o.date)) + '</span>' : '') + '</button></li>';
  }

  function draw() {
    var root = rootEl;
    api.get('events').then(function (events) {
      var y = cur.y, m = cur.m;
      var map = monthMap(events, y, m);
      var up = upcoming(events);
      var monthList = [];
      Object.keys(map).sort().forEach(function (k) { map[k].forEach(function (o) { monthList.push(o); }); });

      var nextBig = '';
      if (up.length) {
        var n = up[0], cat = NC.catMeta(n.ev.category), days = NC.daysBetween(NC.today(), n.date);
        nextBig = '<article class="countdown-card glass tilt" data-tilt="6" data-ev="' + n.ev.id + '">' +
          '<span class="eyebrow">Próxima data</span>' +
          '<div class="cd-row">' + heart(cat.color, 'big') + '<div><strong class="next-title">' + esc(n.ev.title) + '</strong>' +
          '<span class="muted small">' + esc(NC.fmtDate(n.date)) + '</span></div></div>' +
          '<p class="big-countdown"><span>' + (days === 0 ? 'Hoje!' : days) + '</span> ' + (days === 0 ? '🎉' : (days === 1 ? 'dia' : 'dias')) + '</p></article>';
      }

      root.innerHTML =
        '<header class="page-head"><div><h1 class="h1">Nosso calendário de amor</h1>' +
          '<p class="muted">Cada data importante, guardada com carinho.</p></div>' +
          '<button type="button" class="btn btn-primary" data-act="new">' + icon('plus', { size: 18 }) + ' Novo evento</button></header>' +
        '<div class="cal-layout">' +
          '<section class="glass cal-card" aria-label="Calendário">' +
            '<div class="cal-nav">' +
              '<button type="button" class="icon-btn" data-act="prev" aria-label="Mês anterior">' + icon('chevL') + '</button>' +
              '<h2 class="cal-title" aria-live="polite">' + MONTHS[m] + ' <span>' + y + '</span></h2>' +
              '<button type="button" class="icon-btn" data-act="next" aria-label="Próximo mês">' + icon('chevR') + '</button>' +
              '<button type="button" class="btn btn-ghost btn-sm" data-act="today">Hoje</button>' +
            '</div>' +
            '<div class="cal-grid">' + gridHTML(map, y, m) + '</div>' +
            '<ul class="legend">' + CATS.map(function (c) { return '<li>' + heart(c.color) + esc(c.label) + '</li>'; }).join('') + '</ul>' +
          '</section>' +
          '<aside class="cal-side">' + nextBig +
            '<section class="glass card-pad"><h3 class="h3">Próximos eventos</h3>' +
              (up.length ? '<ul class="ev-list">' + up.slice(0, 6).map(function (o) { return evRow(o, true); }).join('') + '</ul>'
                         : '<p class="muted">Nada marcado por enquanto. Que tal criar o primeiro evento?</p>') + '</section>' +
            '<section class="glass card-pad"><h3 class="h3">Em ' + MONTHS[m].toLowerCase() + '</h3>' +
              (monthList.length ? '<ul class="ev-list">' + monthList.map(function (o) { return evRow(o, false); }).join('') + '</ul>'
                                : '<p class="muted">Nenhum evento neste mês.</p>') + '</section>' +
          '</aside></div>';
      api.hydrate(root);
    }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
  }

  function onClick(e) {
    var t = e.target.closest('[data-act],[data-date],[data-ev]');
    if (!t || !rootEl.contains(t)) return;
    var act = t.getAttribute('data-act');
    if (act === 'prev') { cur.m--; if (cur.m < 0) { cur.m = 11; cur.y--; } draw(); }
    else if (act === 'next') { cur.m++; if (cur.m > 11) { cur.m = 0; cur.y++; } draw(); }
    else if (act === 'today') { var n = new Date(); cur.y = n.getFullYear(); cur.m = n.getMonth(); draw(); }
    else if (act === 'new') openForm(null, NC.todayStr());
    else if (t.hasAttribute('data-date')) openDay(t.getAttribute('data-date'));
    else if (t.hasAttribute('data-ev')) {
      api.get('events').then(function (evs) {
        var ev = evs.filter(function (x) { return x.id === t.getAttribute('data-ev'); })[0];
        if (ev) openDetail(ev);
      });
    }
  }

  /* ---------- dia: lista de eventos ou novo evento ---------- */
  function openDay(iso) {
    api.get('events').then(function (events) {
      var d = NC.parseDate(iso);
      var list = [];
      events.forEach(function (ev) {
        var o = NC.occurrenceInYear(ev, d.getFullYear());
        if (o && NC.toISO(o) === iso) list.push({ ev: ev, date: o });
      });
      if (!list.length) { openForm(null, iso); return; }
      var ctl = NC.modal({
        title: NC.fmtDate(d), size: 'sm',
        html: '<ul class="ev-list">' + list.map(function (o) { return evRow(o, false); }).join('') + '</ul>' +
          '<div class="form-actions"><button type="button" class="btn btn-ghost" data-add>' + icon('plus', { size: 16 }) + ' Adicionar neste dia</button></div>',
        onMount: function (c) {
          c.el.addEventListener('click', function (e) {
            var r = e.target.closest('[data-ev]');
            if (r) {
              var ev = events.filter(function (x) { return x.id === r.getAttribute('data-ev'); })[0];
              c.close(); if (ev) openDetail(ev);
            } else if (e.target.closest('[data-add]')) { c.close(); openForm(null, iso); }
          });
        }
      });
      return ctl;
    });
  }

  /* ---------- detalhes de um evento ---------- */
  function openDetail(ev) {
    var cat = NC.catMeta(ev.category), next = NC.nextOccurrence(ev), base = NC.parseDate(ev.event_date);
    var years = '';
    if (ev.repeat_yearly && next) {
      var yy = next.getFullYear() - base.getFullYear();
      if (yy > 0) years = '<span class="pill">' + (NC.daysBetween(NC.today(), next) === 0 ? 'Hoje: ' : 'Vai fazer ') + NC.plural(yy, 'ano', 'anos') + '</span>';
    }
    NC.modal({
      title: ev.title,
      html:
        (ev.photo_path ? '<div class="detail-photo"><img data-path="' + esc(ev.photo_path) + '" alt="' + esc(ev.title) + '"></div>' : '') +
        '<div class="detail-meta"><span class="chip" style="--chip:' + cat.color + '">' + heart(cat.color) + esc(cat.label) + '</span>' +
          (ev.repeat_yearly ? '<span class="chip">' + icon('heart', { size: 13 }) + ' Todo ano</span>' : '') +
          (ev.is_favorite ? '<span class="chip">' + icon('star', { size: 13, fill: true }) + ' Favorito</span>' : '') + '</div>' +
        '<p class="detail-date">' + esc(NC.fmtDate(ev.event_date)) + '</p>' +
        (next ? '<p class="detail-count"><span class="pill">' + esc(NC.countdownText(next)) + '</span> ' + years + '</p>' : '<p class="muted small">Essa data já passou.</p>') +
        (ev.description ? '<p class="detail-text">' + esc(ev.description).replace(/\n/g, '<br>') + '</p>' : '') +
        '<div class="form-actions">' +
          '<button type="button" class="btn btn-danger-ghost" data-del>' + icon('trash', { size: 16 }) + ' Excluir</button>' +
          '<button type="button" class="btn btn-primary" data-edit>' + icon('edit', { size: 16 }) + ' Editar</button></div>',
      onMount: function (c) {
        api.hydrate(c.el);
        $('[data-edit]', c.el).addEventListener('click', function () { c.close(); openForm(ev); });
        $('[data-del]', c.el).addEventListener('click', function () {
          NC.confirm('Excluir "' + ev.title + '" do calendário?').then(function (ok) {
            if (!ok) return;
            api.remove('events', ev.id).then(function () {
              if (ev.photo_path) api.removeFiles([ev.photo_path]);
              c.close(); NC.toast('Evento excluído.'); draw();
            }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
          });
        });
      }
    });
  }

  /* ---------- criar / editar ---------- */
  function openForm(ev, presetDate) {
    var editing = !!ev;
    var cat0 = ev ? ev.category : 'especial';
    var pending = { file: null, remove: false, preview: null };
    var touchedRepeat = false;
    var opts = CATS.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === cat0 ? ' selected' : '') + '>' + esc(c.label) + '</option>';
    }).join('');
    NC.modal({
      title: editing ? 'Editar evento' : 'Novo evento',
      html:
        '<form id="ev-form" class="form" novalidate>' +
          '<label class="field"><span class="field-label">Título</span>' +
            '<input name="title" type="text" maxlength="80" required placeholder="Ex.: Nosso primeiro encontro" value="' + esc(ev ? ev.title : '') + '">' +
            '<span class="field-error" data-error-for="title" role="alert"></span></label>' +
          '<div class="form-row">' +
            '<label class="field"><span class="field-label">Data</span>' +
              '<input name="date" type="date" required value="' + esc(ev ? ev.event_date : (presetDate || NC.todayStr())) + '">' +
              '<span class="field-error" data-error-for="date" role="alert"></span></label>' +
            '<label class="field"><span class="field-label">Categoria</span><select name="category">' + opts + '</select></label>' +
          '</div>' +
          '<label class="field"><span class="field-label">Descrição</span>' +
            '<textarea name="description" rows="3" maxlength="2000" placeholder="O que aconteceu, como foi…">' + esc(ev ? ev.description : '') + '</textarea></label>' +
          '<div class="field"><span class="field-label">Foto</span>' +
            '<div class="photo-pick" id="ev-photo"></div>' +
            '<input type="file" name="photo" accept="image/*" hidden></div>' +
          '<label class="check"><input type="checkbox" name="repeat"' + ((ev ? ev.repeat_yearly : NC.catMeta(cat0).repeat) ? ' checked' : '') + '><span>Repetir todo ano (aniversários e datas de comemorar)</span></label>' +
          '<label class="check"><input type="checkbox" name="fav"' + (ev && ev.is_favorite ? ' checked' : '') + '><span>Marcar como momento favorito</span></label>' +
          '<p class="form-error" id="ev-msg" role="alert"></p>' +
          '<div class="form-actions"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>' +
          '<button type="submit" class="btn btn-primary">' + (editing ? 'Salvar' : 'Adicionar ao calendário') + '</button></div>' +
        '</form>',
      onClose: function () { if (pending.preview) URL.revokeObjectURL(pending.preview); },
      onMount: function (ctl) {
        var form = $('#ev-form', ctl.el), msg = $('#ev-msg', ctl.el), box = $('#ev-photo', ctl.el);
        function paintPhoto() {
          var src = pending.preview ? '<img src="' + esc(pending.preview) + '" alt="Prévia da foto">'
            : (editing && ev.photo_path && !pending.remove ? '<img data-path="' + esc(ev.photo_path) + '" alt="Foto do evento">' : '');
          box.innerHTML = (src ? '<div class="photo-thumb">' + src + '</div>' : '') +
            '<div class="photo-pick-actions"><button type="button" class="btn btn-ghost btn-sm" data-pick>' + icon('camera', { size: 16 }) + ' ' + (src ? 'Trocar foto' : 'Escolher foto') + '</button>' +
            (src ? '<button type="button" class="btn btn-danger-ghost btn-sm" data-unpick>Remover</button>' : '') + '</div>';
          api.hydrate(box);
        }
        paintPhoto();
        box.addEventListener('click', function (e) {
          if (e.target.closest('[data-pick]')) form.elements.photo.click();
          if (e.target.closest('[data-unpick]')) {
            if (pending.preview) URL.revokeObjectURL(pending.preview);
            pending.file = null; pending.preview = null; pending.remove = true; paintPhoto();
          }
        });
        form.elements.photo.addEventListener('change', function (e) {
          var f = e.target.files && e.target.files[0];
          e.target.value = '';
          if (!f) return;
          if (!/^image\//.test(f.type)) { NC.toast('Escolha uma imagem (JPG, PNG, WebP ou GIF).', 'error'); return; }
          if (pending.preview) URL.revokeObjectURL(pending.preview);
          pending.file = f; pending.remove = false; pending.preview = URL.createObjectURL(f); paintPhoto();
        });
        form.elements.repeat.addEventListener('change', function () { touchedRepeat = true; });
        form.elements.category.addEventListener('change', function () {
          if (!editing && !touchedRepeat) form.elements.repeat.checked = NC.catMeta(form.elements.category.value).repeat;
        });

        form.addEventListener('submit', function (e) {
          e.preventDefault(); NC.clearErrors(form); msg.textContent = '';
          var title = form.elements.title.value.trim(), date = form.elements.date.value, ok = true;
          if (!title) { NC.fieldError(form, 'title', 'Dê um nome para este momento.'); ok = false; }
          if (!date) { NC.fieldError(form, 'date', 'Escolha a data.'); ok = false; }
          if (!ok) return;
          var btn = $('button[type=submit]', form); NC.busy(btn, true, 'Salvando…');
          var newPath = null, photo = editing ? ev.photo_path : null;
          var prep = pending.file ? NC.prepareImage(pending.file, 1600, 0.86).then(function (p) {
            return api.upload(p.blob, p.ext).then(function (path) { newPath = path; photo = path; });
          }) : Promise.resolve();
          if (!pending.file && pending.remove) photo = null;
          prep.then(function () {
            var row = {
              title: title, event_date: date, category: form.elements.category.value,
              description: form.elements.description.value.trim(), photo_path: photo,
              repeat_yearly: form.elements.repeat.checked, is_favorite: form.elements.fav.checked
            };
            return editing ? api.update('events', ev.id, row) : api.insert('events', row);
          }).then(function () {
            if (editing && ev.photo_path && ev.photo_path !== photo) api.removeFiles([ev.photo_path]);
            var d = NC.parseDate(date); cur.y = d.getFullYear(); cur.m = d.getMonth();
            ctl.close(); NC.toast(editing ? 'Evento atualizado ❤️' : 'Evento adicionado ao calendário ❤️', 'success'); draw();
          }).catch(function (err) {
            if (newPath) api.removeFiles([newPath]);
            NC.busy(btn, false); msg.textContent = api.errorText(err);
          });
        });
      }
    });
  }

  NC.views.calendar = {
    destroy: function () { if (rootEl) rootEl.removeEventListener('click', onClick); },
    render: function (root, ctx) {
      var n = new Date();
      if (cur.y == null) { cur.y = n.getFullYear(); cur.m = n.getMonth(); }
      return api.get('events', true).then(function () {
        if (!ctx.alive()) return;
        rootEl = root;
        root.addEventListener('click', onClick);
        draw();
      });
    }
  };
})();

/* ===== js/views/album.js ===== */
/* Nosso álbum: mosaico de fotos, upload real, favoritas e melhores lembranças. */
(function () {
  'use strict';
  var NC = window.NC, api = NC.api, $ = NC.$, esc = NC.esc, icon = NC.icon;
  var state = { tab: 'todas', cat: '' };
  var rootEl = null;
  var MAX_FILES = 20;

  function dateOf(p) { return p.taken_on || String(p.created_at).slice(0, 10); }
  function sorted(photos) {
    return photos.slice().sort(function (a, b) {
      var da = dateOf(a), db = dateOf(b);
      if (da !== db) return da < db ? 1 : -1;
      return a.created_at < b.created_at ? 1 : -1;
    });
  }
  function catKey(c) { return String(c || '').trim().toLowerCase(); }
  function categoriesOf(photos) {
    var seen = {}, out = [];
    photos.forEach(function (p) {
      var k = catKey(p.category);
      if (k && !seen[k]) { seen[k] = 1; out.push(p.category); }
    });
    return out.sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
  }
  function visible(photos) {
    return sorted(photos).filter(function (p) {
      if (state.tab === 'favoritas' && !p.is_favorite) return false;
      if (state.tab === 'melhores' && !p.is_best) return false;
      if (state.cat && catKey(p.category) !== catKey(state.cat)) return false;
      return true;
    });
  }

  function draw() {
    api.get('photos').then(function (photos) {
      var favs = photos.filter(function (p) { return p.is_favorite; }).length;
      var best = photos.filter(function (p) { return p.is_best; }).length;
      var cats = categoriesOf(photos);
      if (state.cat && cats.map(catKey).indexOf(catKey(state.cat)) < 0) state.cat = '';
      var list = visible(photos);

      var emptyMsg = !photos.length
        ? '<div class="empty glass"><div class="empty-ico">' + icon('image', { size: 40 }) + '</div><h2>O nosso álbum está esperando</h2>' +
          '<p class="muted">Adicione as primeiras fotos do casal. Elas ficam guardadas só para vocês dois.</p>' +
          '<button type="button" class="btn btn-primary" data-act="add">' + icon('upload', { size: 18 }) + ' Adicionar fotos</button></div>'
        : (!list.length
          ? '<div class="empty glass"><h2>Nada por aqui ainda</h2><p class="muted">' +
            (state.tab === 'favoritas' ? 'Toque no coração de uma foto para ela aparecer aqui.'
              : state.tab === 'melhores' ? 'Toque na estrela de uma foto para guardá-la entre as melhores lembranças.'
              : 'Nenhuma foto nesta categoria.') + '</p></div>' : '');

      rootEl.innerHTML =
        '<header class="page-head"><div><h1 class="h1">Nosso álbum</h1>' +
          '<p class="muted">' + (photos.length ? NC.plural(photos.length, 'foto guardada', 'fotos guardadas') + ' com carinho' : 'Fotos e memórias só nossas') + '</p></div>' +
          '<button type="button" class="btn btn-primary" data-act="add">' + icon('upload', { size: 18 }) + ' Adicionar fotos</button>' +
          '<input type="file" id="album-input" accept="image/*" multiple hidden></header>' +
        '<div class="tabs tabs-wide" role="tablist">' +
          tabBtn('todas', 'Todas', photos.length) + tabBtn('favoritas', 'Favoritas', favs, 'heart') + tabBtn('melhores', 'Nossas melhores lembranças', best, 'star') +
        '</div>' +
        (cats.length > 1 ? '<div class="chips" role="group" aria-label="Categorias">' +
          '<button type="button" class="chip-btn' + (!state.cat ? ' active' : '') + '" data-cat="">Todas as categorias</button>' +
          cats.map(function (c) { return '<button type="button" class="chip-btn' + (catKey(c) === catKey(state.cat) ? ' active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' : '') +
        emptyMsg +
        '<div class="mosaic">' + list.map(tileHTML).join('') + '</div>';
      api.hydrate(rootEl);
    }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
  }
  function tabBtn(id, label, n, ico) {
    return '<button type="button" role="tab" class="tab' + (state.tab === id ? ' active' : '') + '" data-tab="' + id + '" aria-selected="' + (state.tab === id) + '">' +
      (ico ? icon(ico, { size: 15, fill: state.tab === id }) + ' ' : '') + esc(label) + ' <span class="count">' + n + '</span></button>';
  }
  function tileHTML(p) {
    var ratio = p.width && p.height ? (p.width / p.height) : 0.8;
    ratio = Math.max(0.55, Math.min(1.8, ratio));
    return '<button type="button" class="tile tilt" data-tilt="8" data-id="' + p.id + '" style="aspect-ratio:' + ratio.toFixed(3) + '" aria-label="Abrir foto' + (p.caption ? ': ' + esc(p.caption) : '') + '">' +
      '<img data-path="' + esc(p.path) + '" alt="' + esc(p.caption || 'Foto do nosso álbum') + '" loading="lazy" decoding="async">' +
      '<span class="tile-badges">' + (p.is_favorite ? '<span class="b-fav">' + icon('heart', { size: 14, fill: true }) + '</span>' : '') + (p.is_best ? '<span class="b-best">' + icon('star', { size: 14, fill: true }) + '</span>' : '') + '</span>' +
      '<span class="tile-cap">' + (p.caption ? '<strong>' + esc(p.caption) + '</strong>' : '') + '<small>' + esc(NC.fmtDate(dateOf(p))) + ' · ' + esc(p.category) + '</small></span></button>';
  }

  function onClick(e) {
    var t = e.target.closest('[data-act],[data-tab],[data-cat],[data-id]');
    if (!t || !rootEl.contains(t)) return;
    if (t.hasAttribute('data-tab')) { state.tab = t.getAttribute('data-tab'); draw(); }
    else if (t.hasAttribute('data-cat')) { state.cat = t.getAttribute('data-cat'); draw(); }
    else if (t.getAttribute('data-act') === 'add') { $('#album-input', rootEl) ? $('#album-input', rootEl).click() : null; }
    else if (t.hasAttribute('data-id')) {
      api.get('photos').then(function (photos) {
        var list = visible(photos);
        var i = list.map(function (p) { return p.id; }).indexOf(t.getAttribute('data-id'));
        if (i >= 0) openLightbox(list, i);
      });
    }
  }

  /* ---------------------------------------------------- upload de fotos */
  function openUpload(files) {
    files = files.filter(function (f) { return /^image\//.test(f.type || ''); });
    if (!files.length) { NC.toast('Escolha imagens (JPG, PNG, WebP ou GIF).', 'error'); return; }
    if (files.length > MAX_FILES) { NC.toast('Vamos enviar as primeiras ' + MAX_FILES + ' fotos de cada vez.'); files = files.slice(0, MAX_FILES); }
    var urls = files.map(function (f) { return URL.createObjectURL(f); });
    api.get('photos').then(function (photos) {
      var cats = categoriesOf(photos);
      var rows = files.map(function (f, i) {
        return '<div class="up-row" data-i="' + i + '">' +
          '<div class="up-thumb"><img src="' + esc(urls[i]) + '" alt=""></div>' +
          '<div class="up-fields">' +
            '<input type="text" name="caption-' + i + '" maxlength="140" placeholder="Legenda (opcional)" aria-label="Legenda da foto ' + (i + 1) + '">' +
            '<textarea name="desc-' + i + '" rows="2" maxlength="2000" placeholder="Descrição ou lembrança (opcional)" aria-label="Descrição da foto ' + (i + 1) + '"></textarea>' +
            '<span class="up-status" data-status="' + i + '"></span>' +
          '</div></div>';
      }).join('');
      NC.modal({
        title: files.length === 1 ? 'Nova foto' : files.length + ' fotos novas', dismissable: false,
        onClose: function () { urls.forEach(function (u) { URL.revokeObjectURL(u); }); },
        html:
          '<form id="up-form" class="form" novalidate>' +
            '<div class="form-row">' +
              '<label class="field"><span class="field-label">Data da lembrança</span><input type="date" name="date" max="' + NC.todayStr() + '" value="' + NC.todayStr() + '" required>' +
                '<span class="field-error" data-error-for="date" role="alert"></span></label>' +
              '<label class="field"><span class="field-label">Momento ou categoria</span><input type="text" name="category" list="cat-list" maxlength="40" value="Momentos" required placeholder="Ex.: Viagens, Rolês, Casa">' +
                '<datalist id="cat-list">' + cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist>' +
                '<span class="field-error" data-error-for="category" role="alert"></span></label>' +
            '</div>' +
            '<div class="up-list">' + rows + '</div>' +
            '<p class="form-error" id="up-msg" role="alert"></p>' +
            '<div class="form-actions"><button type="button" class="btn btn-ghost" data-close id="up-cancel">Cancelar</button>' +
            '<button type="submit" class="btn btn-primary" id="up-go">' + icon('upload', { size: 16 }) + ' Enviar ' + (files.length === 1 ? 'foto' : files.length + ' fotos') + '</button></div>' +
          '</form>',
        onMount: function (ctl) {
          var form = $('#up-form', ctl.el), msg = $('#up-msg', ctl.el);
          form.addEventListener('submit', function (e) {
            e.preventDefault(); NC.clearErrors(form); msg.textContent = '';
            var date = form.elements.date.value, cat = form.elements.category.value.trim(), ok = true;
            if (!date) { NC.fieldError(form, 'date', 'Escolha a data.'); ok = false; }
            if (date > NC.todayStr()) { NC.fieldError(form, 'date', 'A data não pode estar no futuro.'); ok = false; }
            if (!cat) { NC.fieldError(form, 'category', 'Dê um nome ao momento.'); ok = false; }
            if (!ok) return;
            var go = $('#up-go', form); go.disabled = true; $('#up-cancel', form).disabled = true;
            var done = 0, failed = 0, i = 0;
            function next() {
              if (i >= files.length) return finish();
              var idx = i++, status = $('[data-status="' + idx + '"]', form);
              go.textContent = 'Enviando ' + (idx + 1) + ' de ' + files.length + '…';
              status.textContent = 'Enviando…'; status.className = 'up-status';
              var path = null;
              NC.prepareImage(files[idx], 1800, 0.86).then(function (p) {
                return api.upload(p.blob, p.ext).then(function (pth) {
                  path = pth;
                  return api.insert('photos', {
                    path: pth, caption: form.elements['caption-' + idx].value.trim(),
                    description: form.elements['desc-' + idx].value.trim(),
                    taken_on: date, category: cat, width: p.width, height: p.height
                  });
                });
              }).then(function () {
                done++; status.textContent = 'Pronta ✓'; status.className = 'up-status ok';
              }).catch(function (err) {
                failed++; if (path) api.removeFiles([path]);
                status.textContent = err && err.message && !err.status ? (/imagem|Não consegui/.test(err.message) ? err.message : api.errorText(err)) : api.errorText(err);
                status.className = 'up-status bad';
              }).then(next);
            }
            function finish() {
              if (!failed) {
                ctl.close();
                NC.toast(done === 1 ? 'Foto guardada no álbum ❤️' : done + ' fotos guardadas no álbum ❤️', 'success');
                state.tab = 'todas'; state.cat = '';
                draw();
              } else {
                msg.textContent = done ? done + ' enviada(s). ' + failed + ' não foi(ram) enviada(s) — veja os avisos acima.' : 'Nenhuma foto foi enviada. Veja os avisos acima.';
                go.textContent = 'Fechar'; go.disabled = false; go.type = 'button';
                go.onclick = function () { ctl.close(); draw(); };
              }
            }
            next();
          });
        }
      });
    });
  }

  /* ------------------------------------------------------ foto ampliada */
  function openLightbox(list, start) {
    var idx = start, editing = false, dead = false, sx = null;
    var ctl = NC.modal({
      bare: true, className: 'lightbox-modal', title: 'Foto ampliada', autofocus: false,
      html: '<div class="lightbox"><div class="lb-stage" id="lb-stage"></div><aside class="lb-info" id="lb-info"></aside></div>',
      onClose: function () { dead = true; document.removeEventListener('keydown', onKey); draw(); },
      onMount: function (c) { api.urls(list.map(function (p) { return p.path; })).then(function () { paint(); }); }
    });
    function cur() { return list[idx]; }
    function paint() {
      if (dead) return;
      var p = cur();
      var stage = $('#lb-stage', ctl.el), info = $('#lb-info', ctl.el);
      stage.innerHTML =
        '<button type="button" class="icon-btn glass-btn lb-close" data-close aria-label="Fechar">' + icon('x') + '</button>' +
        (list.length > 1 ? '<button type="button" class="icon-btn glass-btn lb-nav prev" data-nav="-1" aria-label="Foto anterior">' + icon('chevL') + '</button>' +
          '<button type="button" class="icon-btn glass-btn lb-nav next" data-nav="1" aria-label="Próxima foto">' + icon('chevR') + '</button>' : '') +
        '<img class="lb-img" src="' + esc(api.urlFor(p.path)) + '" alt="' + esc(p.caption || 'Foto do nosso álbum') + '">' +
        '<span class="lb-count">' + (idx + 1) + ' / ' + list.length + '</span>';
      if (editing) {
        info.innerHTML =
          '<form id="lb-form" class="form" novalidate>' +
            '<label class="field"><span class="field-label">Legenda</span><input name="caption" maxlength="140" value="' + esc(p.caption) + '"></label>' +
            '<div class="form-row"><label class="field"><span class="field-label">Data</span><input type="date" name="date" max="' + NC.todayStr() + '" value="' + esc(dateOf(p)) + '" required></label>' +
            '<label class="field"><span class="field-label">Categoria</span><input name="category" maxlength="40" value="' + esc(p.category) + '" required></label></div>' +
            '<label class="field"><span class="field-label">Descrição</span><textarea name="description" rows="4" maxlength="2000">' + esc(p.description) + '</textarea></label>' +
            '<p class="form-error" id="lb-msg" role="alert"></p>' +
            '<div class="form-actions"><button type="button" class="btn btn-ghost" data-cancel>Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
        var f = $('#lb-form', info);
        $('[data-cancel]', f).addEventListener('click', function () { editing = false; paint(); });
        f.addEventListener('submit', function (e) {
          e.preventDefault();
          var date = f.elements.date.value, cat = f.elements.category.value.trim(), msg = $('#lb-msg', f);
          if (!date || !cat) { msg.textContent = 'Preencha a data e a categoria.'; return; }
          if (date > NC.todayStr()) { msg.textContent = 'A data não pode estar no futuro.'; return; }
          var btn = $('button[type=submit]', f); NC.busy(btn, true, 'Salvando…');
          api.update('photos', p.id, { caption: f.elements.caption.value.trim(), description: f.elements.description.value.trim(), taken_on: date, category: cat })
            .then(function (row) { list[idx] = row; editing = false; NC.toast('Foto atualizada ❤️', 'success'); paint(); })
            .catch(function (err) { NC.busy(btn, false); msg.textContent = api.errorText(err); });
        });
      } else {
        info.innerHTML =
          '<div class="lb-actions">' +
            '<button type="button" class="icon-btn' + (p.is_favorite ? ' on fav' : '') + '" data-do="fav" aria-pressed="' + !!p.is_favorite + '" aria-label="' + (p.is_favorite ? 'Tirar das favoritas' : 'Favoritar') + '" title="Favorita">' + icon('heart', { fill: p.is_favorite }) + '</button>' +
            '<button type="button" class="icon-btn' + (p.is_best ? ' on best' : '') + '" data-do="best" aria-pressed="' + !!p.is_best + '" aria-label="' + (p.is_best ? 'Tirar das melhores lembranças' : 'Guardar entre as melhores lembranças') + '" title="Nossas melhores lembranças">' + icon('star', { fill: p.is_best }) + '</button>' +
            '<button type="button" class="icon-btn" data-do="edit" aria-label="Editar" title="Editar">' + icon('edit') + '</button>' +
            '<button type="button" class="icon-btn danger" data-do="del" aria-label="Excluir" title="Excluir">' + icon('trash') + '</button></div>' +
          (p.caption ? '<h2 class="lb-title">' + esc(p.caption) + '</h2>' : '<h2 class="lb-title muted">Sem legenda</h2>') +
          '<p class="lb-meta">' + icon('calendar', { size: 14 }) + ' ' + esc(NC.fmtDate(dateOf(p))) + ' <span class="chip">' + esc(p.category) + '</span></p>' +
          (p.description ? '<p class="lb-desc">' + esc(p.description).replace(/\n/g, '<br>') + '</p>' : '<p class="muted small">Toque no lápis para contar essa lembrança.</p>') +
          '<p class="muted small">Adicionada por ' + esc(api.nameOf(p.created_by)) + '</p>';
      }
      var pre = list[(idx + 1) % list.length];
      if (pre && pre !== p) { var im = new Image(); im.src = api.urlFor(pre.path); }
    }
    function go(d) { if (list.length < 2 || editing) return; idx = (idx + d + list.length) % list.length; paint(); }
    function onKey(e) {
      if (!document.body.contains(ctl.el) || editing) return;
      if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
    }
    document.addEventListener('keydown', onKey);
    ctl.el.addEventListener('click', function (e) {
      var nav = e.target.closest('[data-nav]');
      if (nav) { go(+nav.getAttribute('data-nav')); return; }
      var d = e.target.closest('[data-do]');
      if (!d) return;
      var p = cur(), act = d.getAttribute('data-do');
      if (act === 'edit') { editing = true; paint(); }
      else if (act === 'fav' || act === 'best') {
        var field = act === 'fav' ? 'is_favorite' : 'is_best', patch = {};
        patch[field] = !p[field];
        api.update('photos', p.id, patch).then(function (row) {
          list[idx] = row; paint();
          if (patch[field]) NC.fx.burst(d.getBoundingClientRect().left + 18, d.getBoundingClientRect().top + 18, 7);
        }).catch(function (err) { NC.toast(api.errorText(err), 'error'); });
      } else if (act === 'del') {
        NC.confirm('Excluir esta foto do álbum? Não dá para desfazer.').then(function (ok) {
          if (!ok) return;
          api.remove('photos', p.id).then(function () {
            api.removeFiles([p.path]);
            list.splice(idx, 1);
            NC.toast('Foto excluída.');
            if (!list.length) { ctl.close(); return; }
            idx = Math.min(idx, list.length - 1); paint();
          }).catch(function (err) { NC.toast(api.errorText(err), 'error'); });
        });
      }
    });
    ctl.el.addEventListener('pointerdown', function (e) { if (e.target.closest('.lb-stage') && !e.target.closest('button')) sx = e.clientX; });
    ctl.el.addEventListener('pointerup', function (e) {
      if (sx == null) return;
      var dx = e.clientX - sx; sx = null;
      if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    });
  }

  NC.views.album = {
    destroy: function () {},
    render: function (root, ctx) {
      return api.get('photos', true).then(function () {
        if (!ctx.alive()) return;
        rootEl = root;
        root.addEventListener('click', onClick);
        root.addEventListener('change', function (e) {
          if (e.target.id !== 'album-input') return;
          var files = Array.prototype.slice.call(e.target.files || []);
          e.target.value = '';
          if (files.length) openUpload(files);
        });
        draw();
      });
    }
  };
})();

/* ===== js/views/letters.js ===== */
/* Cartinhas para você: envelopes em 3D, modelos opcionais e animação de abertura. */
(function () {
  'use strict';
  var NC = window.NC, api = NC.api, $ = NC.$, esc = NC.esc, icon = NC.icon;

  var THEMES = [
    { id: 'rose', label: 'Rosa' }, { id: 'wine', label: 'Vinho' }, { id: 'lilac', label: 'Lilás' },
    { id: 'gold', label: 'Dourado' }, { id: 'night', label: 'Noite' }
  ];
  var TEMPLATES = [
    { id: 'saudade', label: 'Abra quando estiver com saudade', title: 'Abra quando estiver com saudade', hint: 'Escreva algo para ler quando a saudade apertar…' },
    { id: 'lembranca', label: 'Uma lembrança especial', title: 'Uma lembrança especial', hint: 'Conte uma lembrança que ficou guardada no coração…' },
    { id: 'motivos', label: 'Motivos pelos quais você é importante para mim', title: 'Motivos pelos quais você é importante para mim', hint: 'Liste os motivos, um por linha…' },
    { id: 'livre', label: 'Carta livre', title: '', hint: 'Escreva o que o coração mandar…' }
  ];
  var rootEl = null;

  function envelopeHTML(theme, inner, cls) {
    return '<div class="envelope th-' + esc(theme) + ' ' + (cls || '') + '">' +
      '<div class="env-back"></div>' +
      '<div class="env-paper"></div>' +
      '<div class="env-front"></div>' +
      '<div class="env-flap"></div>' +
      '<div class="env-seal">' + icon('heart', { fill: true, size: 18 }) + '</div>' +
      (inner || '') + '</div>';
  }

  function draw() {
    api.get('letters').then(function (letters) {
      var me = api.user.id;
      rootEl.innerHTML =
        '<header class="page-head"><div><h1 class="h1">Cartinhas para você</h1>' +
          '<p class="muted">Palavras que ficam: escreva, guarde e releia quando quiser.</p></div>' +
          '<button type="button" class="btn btn-primary" data-act="new">' + icon('plus', { size: 18 }) + ' Escrever cartinha</button></header>' +
        (letters.length
          ? '<div class="letters-grid">' + letters.map(function (l) {
              var mine = l.author_id === me;
              return '<button type="button" class="letter-card tilt" data-tilt="10" data-id="' + l.id + '" aria-label="Abrir a cartinha ' + esc(l.title) + '">' +
                envelopeHTML(l.theme, '<span class="env-title">' + esc(l.title) + '</span>') +
                '<span class="letter-meta"><strong>' + (mine ? 'De você' : 'De ' + esc(api.nameOf(l.author_id))) + '</strong>' +
                '<small>' + esc(NC.fmtDateTime(l.created_at)) + '</small></span></button>';
            }).join('') + '</div>'
          : '<div class="empty glass"><div class="empty-ico">' + icon('mail', { size: 40 }) + '</div><h2>Nenhuma cartinha ainda</h2>' +
            '<p class="muted">Escreva a primeira. Pode ser curtinha — o que importa é ser de vocês.</p>' +
            '<button type="button" class="btn btn-primary" data-act="new">Escrever a primeira cartinha</button></div>');
    }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
  }

  function onClick(e) {
    var t = e.target.closest('[data-act],[data-id]');
    if (!t || !rootEl.contains(t)) return;
    if (t.getAttribute('data-act') === 'new') openForm(null);
    else if (t.hasAttribute('data-id')) {
      api.get('letters').then(function (ls) {
        var l = ls.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
        if (l) openReader(l);
      });
    }
  }

  /* ------------------------------------------------ ler (abrindo o envelope) */
  function openReader(l) {
    var mine = l.author_id === api.user.id;
    var timers = [];
    var ctl = NC.modal({
      bare: true, className: 'reader-modal', title: l.title, autofocus: false,
      onClose: function () { timers.forEach(clearTimeout); },
      html:
        '<div class="reader" id="reader">' +
          '<button type="button" class="icon-btn glass-btn reader-close" data-close aria-label="Fechar">' + icon('x') + '</button>' +
          '<div class="reader-env">' + envelopeHTML(l.theme, '', 'big') + '</div>' +
          '<article class="paper th-' + esc(l.theme) + '">' +
            '<h2 class="paper-title script">' + esc(l.title) + '</h2>' +
            '<div class="paper-body">' + esc(l.body).replace(/\n/g, '<br>') + '</div>' +
            '<p class="paper-sign">— ' + esc(api.nameOf(l.author_id)) + ', ' + esc(NC.fmtDateTime(l.created_at)) + '</p>' +
            '<div class="form-actions paper-actions">' +
              (mine ? '<button type="button" class="btn btn-danger-ghost" data-del>' + icon('trash', { size: 16 }) + ' Excluir</button>' +
                      '<button type="button" class="btn btn-ghost" data-edit>' + icon('edit', { size: 16 }) + ' Editar</button>' : '') +
              '<button type="button" class="btn btn-primary" data-close>Fechar</button></div>' +
          '</article></div>',
      onMount: function (c) {
        var r = $('#reader', c.el);
        var fast = NC.reduceMotion();
        timers.push(setTimeout(function () { r.classList.add('open'); }, fast ? 0 : 250));
        timers.push(setTimeout(function () { r.classList.add('reading'); NC.fx.burst(window.innerWidth / 2, window.innerHeight / 3, 10); }, fast ? 10 : 1500));
        $('.reader-env', r).addEventListener('click', function () { r.classList.add('open', 'reading'); });
        var ed = $('[data-edit]', c.el), dl = $('[data-del]', c.el);
        if (ed) ed.addEventListener('click', function () { c.close(); openForm(l); });
        if (dl) dl.addEventListener('click', function () {
          NC.confirm('Excluir a cartinha "' + l.title + '"? Não dá para desfazer.').then(function (ok) {
            if (!ok) return;
            api.remove('letters', l.id).then(function () { c.close(); NC.toast('Cartinha excluída.'); draw(); })
              .catch(function (er) { NC.toast(api.errorText(er), 'error'); });
          });
        });
      }
    });
    return ctl;
  }

  /* ---------------------------------------------------- escrever / editar */
  function openForm(l) {
    var editing = !!l, theme = l ? l.theme : 'rose', tpl = l ? l.template : null;
    NC.modal({
      title: editing ? 'Editar cartinha' : 'Escrever cartinha',
      html:
        '<form id="lt-form" class="form" novalidate>' +
          (editing ? '' :
            '<div class="field"><span class="field-label">Modelo (opcional)</span><div class="chips" id="tpl-chips">' +
              TEMPLATES.map(function (t) { return '<button type="button" class="chip-btn" data-tpl="' + t.id + '">' + esc(t.label) + '</button>'; }).join('') + '</div></div>') +
          '<label class="field"><span class="field-label">Título</span><input name="title" maxlength="100" required placeholder="Dê um título para a cartinha" value="' + esc(l ? l.title : '') + '">' +
            '<span class="field-error" data-error-for="title" role="alert"></span></label>' +
          '<label class="field"><span class="field-label">Carta</span><textarea name="body" rows="9" maxlength="10000" required placeholder="Escreva o que o coração mandar…">' + esc(l ? l.body : '') + '</textarea>' +
            '<span class="field-error" data-error-for="body" role="alert"></span></label>' +
          '<div class="field"><span class="field-label">Envelope</span><div class="theme-pick" id="theme-pick" role="radiogroup" aria-label="Cor do envelope">' +
            THEMES.map(function (t) {
              return '<button type="button" role="radio" class="theme-dot th-' + t.id + (t.id === theme ? ' active' : '') + '" data-theme="' + t.id + '" aria-checked="' + (t.id === theme) + '" aria-label="' + t.label + '" title="' + t.label + '"></button>';
            }).join('') + '</div></div>' +
          '<p class="form-error" id="lt-msg" role="alert"></p>' +
          '<div class="form-actions"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>' +
          '<button type="submit" class="btn btn-primary">' + (editing ? 'Salvar' : 'Guardar cartinha') + '</button></div>' +
        '</form>',
      onMount: function (ctl) {
        var form = $('#lt-form', ctl.el), msg = $('#lt-msg', ctl.el);
        var chips = $('#tpl-chips', ctl.el);
        if (chips) chips.addEventListener('click', function (e) {
          var b = e.target.closest('[data-tpl]');
          if (!b) return;
          var t = TEMPLATES.filter(function (x) { return x.id === b.getAttribute('data-tpl'); })[0];
          tpl = t.id;
          NC.$$('.chip-btn', chips).forEach(function (x) { x.classList.toggle('active', x === b); });
          if (!form.elements.title.value.trim() || TEMPLATES.some(function (x) { return x.title && x.title === form.elements.title.value; })) form.elements.title.value = t.title;
          form.elements.body.placeholder = t.hint;
          form.elements[t.title ? 'body' : 'title'].focus();
        });
        $('#theme-pick', ctl.el).addEventListener('click', function (e) {
          var b = e.target.closest('[data-theme]');
          if (!b) return;
          theme = b.getAttribute('data-theme');
          NC.$$('.theme-dot', ctl.el).forEach(function (x) {
            var on = x === b; x.classList.toggle('active', on); x.setAttribute('aria-checked', String(on));
          });
        });
        form.addEventListener('submit', function (e) {
          e.preventDefault(); NC.clearErrors(form); msg.textContent = '';
          var title = form.elements.title.value.trim(), body = form.elements.body.value.trim(), ok = true;
          if (!title) { NC.fieldError(form, 'title', 'Dê um título para a cartinha.'); ok = false; }
          if (!body) { NC.fieldError(form, 'body', 'Escreva a sua carta antes de guardar.'); ok = false; }
          if (!ok) return;
          var btn = $('button[type=submit]', form); NC.busy(btn, true, 'Guardando…');
          var p = editing ? api.update('letters', l.id, { title: title, body: body, theme: theme })
                          : api.insert('letters', { title: title, body: body, theme: theme, template: tpl });
          p.then(function () {
            ctl.close(); NC.toast(editing ? 'Cartinha atualizada ❤️' : 'Cartinha guardada ❤️', 'success'); draw();
          }).catch(function (er) { NC.busy(btn, false); msg.textContent = api.errorText(er); });
        });
      }
    });
  }

  NC.views.letters = {
    destroy: function () {},
    render: function (root, ctx) {
      return api.get('letters', true).then(function () {
        if (!ctx.alive()) return;
        rootEl = root;
        root.addEventListener('click', onClick);
        draw();
      });
    }
  };
})();

/* Nossa lista de planos: o que queremos viver juntos, com lembrança e foto. */
(function () {
  'use strict';
  var NC = window.NC, api = NC.api, $ = NC.$, esc = NC.esc, icon = NC.icon;
  var rootEl = null;
  var SUGGESTIONS = ['Conhecer lugares novos', 'Fazer um piquenique', 'Assistir a filmes', 'Viajar juntos', 'Comemorar datas especiais'];

  function draw() {
    api.get('plans').then(function (plans) {
      var pending = plans.filter(function (p) { return !p.done; });
      var done = plans.filter(function (p) { return p.done; }).sort(function (a, b) { return (b.done_on || '') > (a.done_on || '') ? 1 : -1; });
      var next = pending.filter(function (p) { return p.is_next; })[0];
      var pct = plans.length ? Math.round((done.length / plans.length) * 100) : 0;
      var titles = plans.map(function (p) { return p.title.toLowerCase(); });
      var sugg = SUGGESTIONS.filter(function (s) { return titles.indexOf(s.toLowerCase()) < 0; });

      rootEl.innerHTML =
        '<header class="page-head"><div><h1 class="h1">Nossa lista de planos</h1>' +
          '<p class="muted">Tudo o que queremos viver juntos.</p></div></header>' +
        '<section class="adventure-hero glass' + (next ? ' tilt' : '') + '" ' + (next ? 'data-tilt="5"' : '') + '>' +
          '<div class="adv-text"><span class="eyebrow">' + icon('compass', { size: 16 }) + ' Próxima aventura</span>' +
          (next ? '<h2 class="adv-title">' + esc(next.title) + '</h2>' + (next.notes ? '<p class="muted">' + esc(next.notes) + '</p>' : '') +
              '<div class="adv-actions"><button type="button" class="btn btn-primary" data-act="finish" data-id="' + next.id + '">' + icon('check', { size: 16 }) + ' Realizamos!</button>' +
              '<button type="button" class="btn btn-ghost" data-act="pick">Trocar</button></div>'
            : '<h2 class="adv-title muted">Ainda não escolhemos</h2><p class="muted">Destaque um dos planos da lista para ele aparecer aqui, e na página inicial.</p>' +
              (pending.length ? '<div class="adv-actions"><button type="button" class="btn btn-primary" data-act="pick">Escolher a próxima aventura</button></div>' : '')) +
          '</div>' +
          '<div class="adv-progress" role="img" aria-label="' + done.length + ' de ' + plans.length + ' planos realizados">' +
            '<svg viewBox="0 0 36 36" class="ring"><path class="ring-bg" d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 1 1 0-31"/>' +
            '<path class="ring-fg" stroke-dasharray="' + pct + ', 100" d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 1 1 0-31"/></svg>' +
            '<div class="ring-text"><strong>' + done.length + '</strong><span>de ' + plans.length + '</span></div></div>' +
        '</section>' +
        '<form class="plan-add glass" id="plan-form" novalidate>' +
          '<input name="title" maxlength="100" placeholder="O que queremos fazer juntos?" aria-label="Novo plano" autocomplete="off">' +
          '<button type="submit" class="btn btn-primary">' + icon('plus', { size: 18 }) + ' Adicionar</button></form>' +
        '<p class="form-error plan-err" id="plan-msg" role="alert"></p>' +
        (sugg.length ? '<div class="chips" aria-label="Ideias"><span class="muted small">Ideias:</span>' +
          sugg.map(function (s) { return '<button type="button" class="chip-btn" data-sugg="' + esc(s) + '">+ ' + esc(s) + '</button>'; }).join('') + '</div>' : '') +
        '<section class="section"><h2 class="h2">Para fazer <span class="count">' + pending.length + '</span></h2>' +
          (pending.length ? '<ul class="plan-list">' + pending.map(planRow).join('') + '</ul>'
            : '<p class="muted">' + (plans.length ? 'Tudo realizado! Que tal sonhar com novos planos?' : 'A lista está vazia. Adicione o primeiro plano acima.') + '</p>') + '</section>' +
        (done.length ? '<section class="section"><h2 class="h2">Já realizamos <span class="count">' + done.length + '</span></h2><ul class="plan-list done">' + done.map(planRow).join('') + '</ul></section>' : '');
      api.hydrate(rootEl);
    }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
  }

  function planRow(p) {
    return '<li class="plan' + (p.done ? ' is-done' : '') + (p.is_next ? ' is-next' : '') + '">' +
      '<button type="button" class="plan-check" data-act="toggle" data-id="' + p.id + '" role="checkbox" aria-checked="' + p.done + '" aria-label="' + (p.done ? 'Desmarcar' : 'Marcar como realizado') + ': ' + esc(p.title) + '">' + (p.done ? icon('check', { size: 16 }) : '') + '</button>' +
      '<button type="button" class="plan-main" data-act="open" data-id="' + p.id + '">' +
        '<strong>' + esc(p.title) + '</strong>' +
        '<span class="muted small">' + (p.done ? 'Realizado em ' + esc(NC.fmtDate(p.done_on || String(p.created_at).slice(0, 10))) + (p.memory ? ' · ' + esc(p.memory.length > 70 ? p.memory.slice(0, 70) + '…' : p.memory) : '')
          : (p.notes ? esc(p.notes.length > 80 ? p.notes.slice(0, 80) + '…' : p.notes) : 'Toque para ver os detalhes')) + '</span></button>' +
      (p.photo_path ? '<span class="plan-photo"><img data-path="' + esc(p.photo_path) + '" alt=""></span>' : '') +
      (p.is_next ? '<span class="pill next-pill">' + icon('compass', { size: 13 }) + ' próxima</span>' : '') + '</li>';
  }

  function add(title) {
    title = (title || '').trim();
    var msg = $('#plan-msg', rootEl);
    if (!title) { if (msg) msg.textContent = 'Escreva o plano antes de adicionar.'; return Promise.resolve(); }
    return api.insert('plans', { title: title }).then(function () { if (msg) msg.textContent = ''; NC.toast('Plano adicionado ❤️', 'success'); draw(); })
      .catch(function (e) { if (msg) msg.textContent = api.errorText(e); else NC.toast(api.errorText(e), 'error'); });
  }
  function find(plans, id) { return plans.filter(function (p) { return p.id === id; })[0]; }

  function onClick(e) {
    var t = e.target.closest('[data-act],[data-sugg]');
    if (!t || !rootEl.contains(t)) return;
    if (t.hasAttribute('data-sugg')) { add(t.getAttribute('data-sugg')); return; }
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    api.get('plans').then(function (plans) {
      var p = id ? find(plans, id) : null;
      if (act === 'toggle' && p) { if (p.done) undo(p); else openFinish(p); }
      else if (act === 'finish' && p) openFinish(p);
      else if (act === 'open' && p) openDetail(p);
      else if (act === 'pick') openPicker(plans.filter(function (x) { return !x.done; }));
    });
  }

  function undo(p) {
    api.update('plans', p.id, { done: false, done_on: null }).then(function () { NC.toast('Plano voltou para a lista.'); draw(); })
      .catch(function (e) { NC.toast(api.errorText(e), 'error'); });
  }

  /* ---- escolher a próxima aventura ---- */
  function openPicker(pending) {
    if (!pending.length) { NC.toast('Adicione um plano primeiro.'); return; }
    NC.modal({
      title: 'Qual será a próxima aventura?', size: 'sm',
      html: '<ul class="pick-list">' + pending.map(function (p) {
        return '<li><button type="button" class="pick-item' + (p.is_next ? ' active' : '') + '" data-id="' + p.id + '">' + icon('compass', { size: 18 }) + '<span>' + esc(p.title) + '</span></button></li>';
      }).join('') + '</ul>',
      onMount: function (c) {
        c.el.addEventListener('click', function (e) {
          var b = e.target.closest('[data-id]');
          if (!b) return;
          api.setNextPlan(b.getAttribute('data-id')).then(function () {
            c.close(); NC.toast('Próxima aventura definida! 🧭', 'success'); NC.fx.burst(window.innerWidth / 2, window.innerHeight / 2, 10); draw();
          }).catch(function (er) { NC.toast(api.errorText(er), 'error'); });
        });
      }
    });
  }

  /* ---- registrar que realizamos ---- */
  function openFinish(p) {
    var pending = { file: null, preview: null };
    NC.modal({
      title: 'Realizamos! ' + p.title,
      onClose: function () { if (pending.preview) URL.revokeObjectURL(pending.preview); },
      html:
        '<form id="fin-form" class="form" novalidate>' +
          '<p class="muted">Guardem a lembrança desse momento — a foto e o texto são opcionais.</p>' +
          '<label class="field"><span class="field-label">Quando foi?</span><input type="date" name="date" max="' + NC.todayStr() + '" value="' + esc(p.done_on || NC.todayStr()) + '" required>' +
            '<span class="field-error" data-error-for="date" role="alert"></span></label>' +
          '<label class="field"><span class="field-label">Como foi?</span><textarea name="memory" rows="4" maxlength="2000" placeholder="O que vocês viveram, o que sentiram…">' + esc(p.memory || '') + '</textarea></label>' +
          '<div class="field"><span class="field-label">Foto da lembrança</span><div class="photo-pick" id="fin-photo"></div><input type="file" name="photo" accept="image/*" hidden></div>' +
          '<p class="form-error" id="fin-msg" role="alert"></p>' +
          '<div class="form-actions"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>' +
          '<button type="submit" class="btn btn-primary">' + icon('check', { size: 16 }) + ' Marcar como realizado</button></div></form>',
      onMount: function (ctl) {
        var form = $('#fin-form', ctl.el), box = $('#fin-photo', ctl.el), msg = $('#fin-msg', ctl.el);
        function paint() {
          var src = pending.preview ? '<img src="' + esc(pending.preview) + '" alt="Prévia">' : (p.photo_path ? '<img data-path="' + esc(p.photo_path) + '" alt="Foto atual">' : '');
          box.innerHTML = (src ? '<div class="photo-thumb">' + src + '</div>' : '') +
            '<div class="photo-pick-actions"><button type="button" class="btn btn-ghost btn-sm" data-pick>' + icon('camera', { size: 16 }) + ' ' + (src ? 'Trocar foto' : 'Escolher foto') + '</button></div>';
          api.hydrate(box);
        }
        paint();
        box.addEventListener('click', function (e) { if (e.target.closest('[data-pick]')) form.elements.photo.click(); });
        form.elements.photo.addEventListener('change', function (e) {
          var f = e.target.files && e.target.files[0]; e.target.value = '';
          if (!f) return;
          if (!/^image\//.test(f.type)) { NC.toast('Escolha uma imagem.', 'error'); return; }
          if (pending.preview) URL.revokeObjectURL(pending.preview);
          pending.file = f; pending.preview = URL.createObjectURL(f); paint();
        });
        form.addEventListener('submit', function (e) {
          e.preventDefault(); NC.clearErrors(form); msg.textContent = '';
          var date = form.elements.date.value;
          if (!date) { NC.fieldError(form, 'date', 'Escolha a data.'); return; }
          if (date > NC.todayStr()) { NC.fieldError(form, 'date', 'A data não pode estar no futuro.'); return; }
          var btn = $('button[type=submit]', form); NC.busy(btn, true, 'Salvando…');
          var newPath = null, photo = p.photo_path;
          (pending.file ? NC.prepareImage(pending.file, 1600, 0.86).then(function (x) {
            return api.upload(x.blob, x.ext).then(function (path) { newPath = path; photo = path; });
          }) : Promise.resolve()).then(function () {
            return api.update('plans', p.id, { done: true, done_on: date, memory: form.elements.memory.value.trim(), photo_path: photo, is_next: false });
          }).then(function () {
            if (newPath && p.photo_path) api.removeFiles([p.photo_path]);
            ctl.close(); NC.toast('Mais uma aventura para a nossa história! 🎉', 'success');
            NC.fx.burst(window.innerWidth / 2, window.innerHeight / 2, 14); draw();
          }).catch(function (er) {
            if (newPath) api.removeFiles([newPath]);
            NC.busy(btn, false); msg.textContent = api.errorText(er);
          });
        });
      }
    });
  }

  /* ---- detalhes / editar ---- */
  function openDetail(p) {
    NC.modal({
      title: p.done ? 'Plano realizado' : 'Plano',
      html:
        '<form id="pl-form" class="form" novalidate>' +
          '<label class="field"><span class="field-label">Plano</span><input name="title" maxlength="100" required value="' + esc(p.title) + '">' +
            '<span class="field-error" data-error-for="title" role="alert"></span></label>' +
          '<label class="field"><span class="field-label">Detalhes (opcional)</span><textarea name="notes" rows="3" maxlength="1000" placeholder="Onde, quando, ideias…">' + esc(p.notes) + '</textarea></label>' +
          (p.done ? '<div class="done-box"><strong>' + icon('check', { size: 15 }) + ' Realizado em ' + esc(NC.fmtDate(p.done_on || String(p.created_at).slice(0, 10))) + '</strong>' +
            (p.memory ? '<p>' + esc(p.memory).replace(/\n/g, '<br>') + '</p>' : '') +
            (p.photo_path ? '<div class="detail-photo"><img data-path="' + esc(p.photo_path) + '" alt="Lembrança de ' + esc(p.title) + '"></div>' : '') +
            '<button type="button" class="link-btn" data-act="edit-memory">Editar a lembrança</button></div>' : '') +
          '<p class="form-error" id="pl-msg" role="alert"></p>' +
          '<div class="form-actions wrap">' +
            '<button type="button" class="btn btn-danger-ghost" data-del>' + icon('trash', { size: 16 }) + ' Excluir</button>' +
            (!p.done ? '<button type="button" class="btn btn-ghost" data-next>' + icon('compass', { size: 16 }) + (p.is_next ? ' Já é a próxima' : ' Próxima aventura') + '</button>' : '') +
            '<button type="submit" class="btn btn-primary">Salvar</button></div></form>',
      onMount: function (ctl) {
        api.hydrate(ctl.el);
        var form = $('#pl-form', ctl.el), msg = $('#pl-msg', ctl.el);
        form.addEventListener('submit', function (e) {
          e.preventDefault(); NC.clearErrors(form); msg.textContent = '';
          var title = form.elements.title.value.trim();
          if (!title) { NC.fieldError(form, 'title', 'O plano precisa de um nome.'); return; }
          var btn = $('button[type=submit]', form); NC.busy(btn, true, 'Salvando…');
          api.update('plans', p.id, { title: title, notes: form.elements.notes.value.trim() })
            .then(function () { ctl.close(); NC.toast('Plano atualizado ❤️', 'success'); draw(); })
            .catch(function (er) { NC.busy(btn, false); msg.textContent = api.errorText(er); });
        });
        var nx = $('[data-next]', ctl.el);
        if (nx) nx.addEventListener('click', function () {
          if (p.is_next) return;
          api.setNextPlan(p.id).then(function () { ctl.close(); NC.toast('Próxima aventura definida! 🧭', 'success'); draw(); })
            .catch(function (er) { NC.toast(api.errorText(er), 'error'); });
        });
        var em = $('[data-act="edit-memory"]', ctl.el);
        if (em) em.addEventListener('click', function () { ctl.close(); openFinish(p); });
        $('[data-del]', ctl.el).addEventListener('click', function () {
          NC.confirm('Excluir o plano "' + p.title + '"?').then(function (ok) {
            if (!ok) return;
            api.remove('plans', p.id).then(function () {
              if (p.photo_path) api.removeFiles([p.photo_path]);
              ctl.close(); NC.toast('Plano excluído.'); draw();
            }).catch(function (er) { NC.toast(api.errorText(er), 'error'); });
          });
        });
      }
    });
  }

  NC.views.plans = {
    destroy: function () {},
    render: function (root, ctx) {
      return api.get('plans', true).then(function () {
        if (!ctx.alive()) return;
        rootEl = root;
        root.addEventListener('click', onClick);
        root.addEventListener('submit', function (e) {
          if (e.target.id !== 'plan-form') return;
          e.preventDefault();
          var inp = e.target.elements.title, v = inp.value;
          add(v).then(function () { /* a lista é redesenhada */ });
        });
        draw();
      });
    }
  };
})();

/* ===== js/views/wall.js ===== */
/* Mural de frases e lembranças + nossos momentos favoritos. */
(function () {
  'use strict';
  var NC = window.NC, api = NC.api, $ = NC.$, esc = NC.esc, icon = NC.icon;
  var rootEl = null, kind = 'frase';

  function tilt(id) {
    var n = 0;
    for (var i = 0; i < id.length; i++) n = (n * 31 + id.charCodeAt(i)) % 9973;
    return ((n % 7) - 3) * 0.8; // -2.4° a 2.4°
  }

  function draw() {
    Promise.all([api.get('wall_notes'), api.get('photos'), api.get('events')]).then(function (d) {
      var notes = d[0], favPhotos = d[1].filter(function (p) { return p.is_favorite; }), favEvents = d[2].filter(function (e) { return e.is_favorite; });
      var me = api.user.id;
      var favItems = '';
      favPhotos.forEach(function (p) {
        favItems += '<a class="fav-card tilt" data-tilt="8" href="#/album" data-hearts>' +
          '<img data-path="' + esc(p.path) + '" alt="' + esc(p.caption || 'Foto favorita') + '" loading="lazy">' +
          '<span class="fav-cap"><strong>' + esc(p.caption || 'Foto favorita') + '</strong><small>' + esc(NC.fmtDate(p.taken_on || String(p.created_at).slice(0, 10))) + '</small></span></a>';
      });
      favEvents.forEach(function (e) {
        var cat = NC.catMeta(e.category);
        favItems += '<a class="fav-card fav-event tilt" data-tilt="8" href="#/calendario" data-hearts>' +
          (e.photo_path ? '<img data-path="' + esc(e.photo_path) + '" alt="' + esc(e.title) + '" loading="lazy">' : '<span class="fav-heart" style="color:' + cat.color + '">' + NC.heartSVG('currentColor') + '</span>') +
          '<span class="fav-cap"><strong>' + esc(e.title) + '</strong><small>' + esc(NC.fmtDate(e.event_date)) + ' · ' + esc(cat.label) + '</small></span></a>';
      });

      rootEl.innerHTML =
        '<header class="page-head"><div><h1 class="h1">Nosso mural</h1>' +
          '<p class="muted">Frases que nos lembram um do outro e pequenas lembranças soltas.</p></div></header>' +
        '<form class="wall-form glass" id="wall-form" novalidate>' +
          '<div class="seg" role="radiogroup" aria-label="Tipo de recado">' +
            '<button type="button" role="radio" class="seg-btn' + (kind === 'frase' ? ' active' : '') + '" data-kind="frase" aria-checked="' + (kind === 'frase') + '">' + icon('sparkles', { size: 15 }) + ' Frase</button>' +
            '<button type="button" role="radio" class="seg-btn' + (kind === 'lembranca' ? ' active' : '') + '" data-kind="lembranca" aria-checked="' + (kind === 'lembranca') + '">' + icon('heart', { size: 15 }) + ' Lembrança</button></div>' +
          '<textarea name="body" rows="2" maxlength="600" aria-label="Novo recado" placeholder="' + (kind === 'frase' ? 'Uma frase que lembra a gente…' : 'Uma lembrança pequena, mas que ficou…') + '"></textarea>' +
          '<div class="wall-form-foot"><span class="muted small" id="wall-count">0 / 600</span>' +
          '<button type="submit" class="btn btn-primary">' + icon('pin', { size: 16 }) + ' Fixar no mural</button></div>' +
          '<p class="form-error" id="wall-msg" role="alert"></p></form>' +
        (notes.length
          ? '<div class="wall-grid">' + notes.map(function (n) {
              var mine = n.author_id === me;
              return '<article class="note k-' + esc(n.kind) + '" style="--r:' + tilt(n.id).toFixed(1) + 'deg">' +
                '<span class="note-pin" aria-hidden="true"></span>' +
                '<p class="note-kind">' + (n.kind === 'frase' ? 'Frase' : 'Lembrança') + '</p>' +
                '<p class="note-body">' + esc(n.body).replace(/\n/g, '<br>') + '</p>' +
                '<footer><span>' + esc(api.nameOf(n.author_id)) + ' · ' + esc(NC.fmtDateTime(n.created_at)) + '</span>' +
                (mine ? '<button type="button" class="icon-btn sm danger" data-del="' + n.id + '" aria-label="Excluir recado" title="Excluir">' + icon('trash', { size: 15 }) + '</button>' : '') + '</footer></article>';
            }).join('') + '</div>'
          : '<div class="empty glass"><div class="empty-ico">' + icon('note', { size: 40 }) + '</div><h2>O mural está vazio</h2><p class="muted">Fixe a primeira frase ou lembrança aí em cima.</p></div>') +
        '<section class="section"><div class="section-head"><h2 class="h2">Nossos momentos favoritos</h2></div>' +
          (favItems ? '<div class="fav-grid">' + favItems + '</div>'
            : '<p class="muted">Marque fotos (coração) e eventos como favoritos e eles aparecem aqui.</p>') + '</section>';
      api.hydrate(rootEl);
    }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
  }

  function onClick(e) {
    var k = e.target.closest('[data-kind]');
    if (k && rootEl.contains(k)) {
      kind = k.getAttribute('data-kind');
      var txt = rootEl.querySelector('textarea[name=body]'), keep = txt ? txt.value : '';
      draw();
      setTimeout(function () { var t = rootEl.querySelector('textarea[name=body]'); if (t) { t.value = keep; t.focus(); counter(); } }, 120);
      return;
    }
    var d = e.target.closest('[data-del]');
    if (d && rootEl.contains(d)) {
      NC.confirm('Tirar este recado do mural?', { okText: 'Excluir' }).then(function (ok) {
        if (!ok) return;
        api.remove('wall_notes', d.getAttribute('data-del')).then(function () { NC.toast('Recado removido.'); draw(); })
          .catch(function (er) { NC.toast(api.errorText(er), 'error'); });
      });
    }
  }
  function counter() {
    var t = rootEl.querySelector('textarea[name=body]'), c = $('#wall-count', rootEl);
    if (t && c) c.textContent = t.value.length + ' / 600';
  }

  NC.views.wall = {
    destroy: function () {},
    render: function (root, ctx) {
      return Promise.all([api.get('wall_notes', true), api.get('photos', true), api.get('events', true)]).then(function () {
        if (!ctx.alive()) return;
        rootEl = root;
        root.addEventListener('click', onClick);
        root.addEventListener('input', function (e) { if (e.target.name === 'body') counter(); });
        root.addEventListener('submit', function (e) {
          if (e.target.id !== 'wall-form') return;
          e.preventDefault();
          var f = e.target, body = f.elements.body.value.trim(), msg = $('#wall-msg', root);
          if (!body) { msg.textContent = 'Escreva algo antes de fixar.'; return; }
          var btn = $('button[type=submit]', f); NC.busy(btn, true, 'Fixando…');
          api.insert('wall_notes', { body: body, kind: kind }).then(function () {
            NC.toast('Fixado no mural ❤️', 'success'); draw();
          }).catch(function (er) { NC.busy(btn, false); msg.textContent = api.errorText(er); });
        });
        draw();
      });
    }
  };
})();

/* Botão "Surpreenda-me": revela uma foto, lembrança ou frase aleatória. */
(function () {
  'use strict';
  var NC = window.NC, api = NC.api, $ = NC.$, esc = NC.esc, icon = NC.icon;
  var last = null;

  function collect() {
    return Promise.all([api.get('photos'), api.get('events'), api.get('plans'), api.get('wall_notes')]).then(function (d) {
      var items = [];
      d[0].forEach(function (p) {
        items.push({ id: 'p' + p.id, kind: 'Foto', path: p.path, title: p.caption, text: p.description, date: p.taken_on || String(p.created_at).slice(0, 10), tag: p.category });
      });
      d[1].forEach(function (e) {
        if (e.photo_path || e.description) items.push({ id: 'e' + e.id, kind: 'Data especial', path: e.photo_path, title: e.title, text: e.description, date: e.event_date, tag: NC.catMeta(e.category).label });
      });
      d[2].forEach(function (p) {
        if (p.done && (p.photo_path || p.memory)) items.push({ id: 'l' + p.id, kind: 'Aventura realizada', path: p.photo_path, title: p.title, text: p.memory, date: p.done_on || String(p.created_at).slice(0, 10) });
      });
      d[3].forEach(function (n) {
        items.push({ id: 'n' + n.id, kind: n.kind === 'frase' ? 'Frase do mural' : 'Lembrança do mural', title: '', text: n.body, date: String(n.created_at).slice(0, 10), big: true });
      });
      return items;
    });
  }

  function pick(items) {
    var pool = items.filter(function (i) { return i.id !== last; });
    if (!pool.length) pool = items;
    var it = pool[Math.floor(Math.random() * pool.length)];
    last = it.id;
    return it;
  }

  function faceHTML(it) {
    return (it.path ? '<div class="sp-photo"><img src="' + esc(api.urlFor(it.path)) + '" alt="' + esc(it.title || 'Lembrança') + '"></div>' : '') +
      '<span class="sp-kind">' + esc(it.kind) + (it.tag ? ' · ' + esc(it.tag) : '') + '</span>' +
      (it.title ? '<h3 class="sp-title">' + esc(it.title) + '</h3>' : '') +
      (it.text ? '<p class="' + (it.big ? 'sp-quote script' : 'sp-text') + '">' + esc(it.text).replace(/\n/g, '<br>') + '</p>' : '') +
      '<span class="muted small">' + esc(NC.fmtDate(it.date)) + '</span>';
  }

  NC.surprise = {
    open: function () {
      collect().then(function (items) {
        if (!items.length) {
          NC.toast('Ainda não há lembranças para sortear. Adicione fotos, datas ou frases e tente de novo!');
          return;
        }
        return api.urls(items.map(function (i) { return i.path; }).filter(Boolean)).then(function () {
          NC.modal({
            title: 'Surpresa para você', className: 'surprise-modal',
            html: '<div class="sp-scene"><div class="sp-card" id="sp-card">' +
              '<div class="sp-face sp-back">' + NC.heart3d(90) + '<p>Toque para abrir</p></div>' +
              '<div class="sp-face sp-front" id="sp-front"></div></div></div>' +
              '<div class="form-actions"><button type="button" class="btn btn-ghost" data-close>Fechar</button>' +
              '<button type="button" class="btn btn-primary" id="sp-again">' + icon('gift', { size: 16 }) + ' Outra surpresa</button></div>',
            onMount: function (c) {
              var card = $('#sp-card', c.el), front = $('#sp-front', c.el);
              function reveal() {
                var it = pick(items);
                front.innerHTML = faceHTML(it);
                card.classList.add('flipped');
                var r = card.getBoundingClientRect();
                NC.fx.burst(r.left + r.width / 2, r.top + r.height / 3, 12);
              }
              card.addEventListener('click', function () { if (!card.classList.contains('flipped')) reveal(); });
              $('#sp-again', c.el).addEventListener('click', function () {
                card.classList.remove('flipped');
                setTimeout(reveal, NC.reduceMotion() ? 0 : 600);
              });
              setTimeout(reveal, NC.reduceMotion() ? 0 : 450);
            }
          });
        });
      }).catch(function (e) { NC.toast(api.errorText(e), 'error'); });
    }
  };
})();
