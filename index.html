      h.style.cssText =
        'left:' + (Math.random() * 100).toFixed(1) + '%;' +
        'width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) + 'px;' +
        'color:' + colors[i % colors.length] + ';' +
        'animation-duration:' + (18 + Math.random() * 22).toFixed(1) + 's;' +
        'animation-delay:-' + (Math.random() * 30).toFixed(1) + 's;' +
        'opacity:' + (0.18 + Math.random() * 0.32).toFixed(2) + ';';
      h.innerHTML = NC.heartSVG('currentColor');
      box.appendChild(h);
    }
  };

  /* ----- explosão de corações ----- */
  fx.burst = function (x, y, count) {
    if (NC.reduceMotion()) return;
    count = count || 9;
    var colors = ['#ff4d88', '#ff9ac1', '#c2185b', '#b794ff', '#ff6b9d', '#ffd1e3'];
    for (var i = 0; i < count; i++) {
      var h = document.createElement('span');
      h.className = 'burst-heart';
      var angle = (Math.PI * 2 * i) / count + Math.random() * 0.6;
      var dist = 50 + Math.random() * 90;
      var size = 12 + Math.random() * 16;
      h.style.cssText =
        'left:' + x + 'px;top:' + y + 'px;width:' + size + 'px;height:' + size + 'px;' +
        'color:' + colors[(Math.random() * colors.length) | 0] + ';' +
        '--dx:' + Math.cos(angle) * dist + 'px;' +
        '--dy:' + (Math.sin(angle) * dist - 60) + 'px;' +
        '--rot:' + ((Math.random() * 80 - 40) | 0) + 'deg;';
      h.innerHTML = NC.heartSVG('currentColor');
      document.body.appendChild(h);
      setTimeout(function (el) { el.remove(); }.bind(null, h), 1400);
    }
    if (NC.bg && NC.bg.pulse) NC.bg.pulse();
  };

  /* ----- número contando até o valor ----- */
  fx.countUp = function (el, to, ms) {
    if (!el) return;
    if (NC.reduceMotion() || to < 2) { el.textContent = to.toLocaleString('pt-BR'); return; }
    var start = performance.now();
    ms = ms || 1200;
    (function step(now) {
      var p = Math.min(1, (now - start) / ms);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e).toLocaleString('pt-BR');
      if (p < 1 && document.body.contains(el)) requestAnimationFrame(step);
    })(start);
  };

  fx.init = function () {
    fx.ambient();

    /* clique em elementos marcados (ou botões principais) solta corações */
    document.addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('[data-hearts], .btn-primary');
      if (!t || t.disabled) return;
      var x = e.clientX, y = e.clientY;
      if (!x && !y) {
        var r = t.getBoundingClientRect();
        x = r.left + r.width / 2; y = r.top + r.height / 2;
      }
      fx.burst(x, y, t.classList.contains('btn-primary') ? 8 : 6);
    });

    /* inclinação 3D que segue o mouse */
    var active = null;
    function reset(el) {
      el.style.setProperty('--rx', '0deg');
      el.style.setProperty('--ry', '0deg');
      el.classList.remove('is-tilting');
    }
    document.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch' || NC.reduceMotion()) return;
      var t = e.target.closest && e.target.closest('.tilt');
      if (active && active !== t) reset(active);
      if (!t) { active = null; return; }
      active = t;
      var r = t.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      var max = parseFloat(t.getAttribute('data-tilt')) || 9;
      t.style.setProperty('--ry', ((px - 0.5) * 2 * max).toFixed(2) + 'deg');
      t.style.setProperty('--rx', ((0.5 - py) * 2 * max).toFixed(2) + 'deg');
      t.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
      t.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
      t.classList.add('is-tilting');
    }, { passive: true });
    document.addEventListener('pointerout', function (e) {
      if (active && !e.relatedTarget) { reset(active); active = null; }
    });

    /* no celular: "afundar" um pouquinho ao tocar */
    document.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'touch') return;
      var t = e.target.closest && e.target.closest('.tilt');
      if (!t) return;
      t.classList.add('pressed');
      var off = function () { t.classList.remove('pressed'); };
      document.addEventListener('pointerup', off, { once: true });
      document.addEventListener('pointercancel', off, { once: true });
    }, { passive: true });
  };
})();

/* ===== js/music.js ===== */
/* Música romântica gerada no próprio navegador (Web Audio): sem arquivos,
   sem direitos autorais. Só toca depois que você clica no botão — o navegador
   não permite som automático, e respeitamos isso. */
(function () {
  'use strict';
  var NC = (window.NC = window.NC || {});
  var Ctx = window.AudioContext || window.webkitAudioContext;

  var chords = [
    [48, 52, 55, 59],  // Cmaj7
    [45, 48, 52, 55],  // Am7
    [41, 45, 48, 52],  // Fmaj7
    [43, 47, 50, 52]   // G6
  ];
  var pattern = [0, 1, 2, 3, 2, 1, 2, 3];
  var STEP = 0.78;           // segundos por nota do arpejo
  var STEPS_PER_CHORD = 8;

  var ctx = null, master = null, bus = null, timer = null;
  var nextTime = 0, step = 0, chordIdx = 0, on = false;
  var listeners = [];

  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function makeReverb() {
    var len = ctx.sampleRate * 3.2, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    var conv = ctx.createConvolver();
    conv.buffer = buf;
    return conv;
  }

  function build() {
    ctx = new Ctx();
    master = ctx.createGain();
    master.gain.value = 0;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.4;
    bus = ctx.createGain();
    var dry = ctx.createGain(); dry.gain.value = 0.7;
    var wet = ctx.createGain(); wet.gain.value = 0.55;
    var rev = makeReverb();
    bus.connect(dry); bus.connect(rev); rev.connect(wet);
    dry.connect(lp); wet.connect(lp);
    lp.connect(master); master.connect(ctx.destination);
  }

  function tone(freq, when, dur, type, peak, attack) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(bus);
    o.start(when); o.stop(when + dur + 0.1);
  }

  function schedule() {
    while (nextTime < ctx.currentTime + 1.4) {
      var chord = chords[chordIdx];
      if (step === 0) {
        // pad suave + baixo no início de cada acorde
        chord.forEach(function (m) {
          tone(hz(m), nextTime, STEP * STEPS_PER_CHORD + 1.2, 'sine', 0.05, 1.4);
          tone(hz(m) * 1.003, nextTime, STEP * STEPS_PER_CHORD + 1.2, 'triangle', 0.018, 1.8);
        });
        tone(hz(chord[0] - 12), nextTime, STEP * STEPS_PER_CHORD, 'sine', 0.11, 0.08);
      }
      // arpejo estilo piano
      if (Math.random() > 0.12) {
        var idx = pattern[step];
        var octave = (step % 4 === 3 && Math.random() > 0.5) ? 24 : 12;
        var f = hz(chord[idx] + octave);
        var vel = 0.075 + Math.random() * 0.035;
        tone(f, nextTime, 2.1, 'triangle', vel, 0.012);
        tone(f * 2, nextTime, 1.1, 'sine', vel * 0.28, 0.01);
      }
      nextTime += STEP;
      step++;
      if (step >= STEPS_PER_CHORD) { step = 0; chordIdx = (chordIdx + 1) % chords.length; }
    }
  }

  function emit() { listeners.forEach(function (fn) { fn(on); }); }

  NC.music = {
    supported: !!Ctx,
    isOn: function () { return on; },
    onChange: function (fn) { listeners.push(fn); },
    start: function () {
      if (!Ctx || on) return;
      if (!ctx) build();
      var go = function () {
        on = true;
        nextTime = ctx.currentTime + 0.15; step = 0; chordIdx = 0;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.85, ctx.currentTime + 1.2);
        schedule();
        timer = setInterval(schedule, 300);
        emit();
      };
      var r = ctx.resume();
      if (r && r.then) r.then(go).catch(function () { NC.toast('O navegador bloqueou o som. Toque no botão de música de novo.', 'error'); });
      else go();
    },
    stop: function () {
      if (!ctx || !on) return;
      on = false;
      clearInterval(timer);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
      var c = ctx;
      setTimeout(function () { if (!on && c.state === 'running') c.suspend(); }, 900);
      emit();
    },
    toggle: function () { if (on) this.stop(); else this.start(); }
  };
})();

/* ===== js/api.js ===== */
/* Camada de dados: autenticação, casal, tabelas e fotos (Supabase). */
(function () {
  'use strict';
  var NC = (window.NC = window.NC || {});
  var cfg = window.NC_CONFIG || {};
  var BUCKET = 'couple-photos';

  var api = (NC.api = {
    configured: !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && /^https?:\/\//.test(cfg.SUPABASE_URL)),
    sb: null, user: null, profile: null, couple: null, members: []
  });

  /* ----- mensagens de erro em português ----- */
  api.errorText = function (err) {
    var m = String((err && (err.message || err.error_description || err.msg)) || err || '');
    var code = err && err.code;
    var map = [
      [/invalid login credentials/i, 'E-mail ou senha incorretos.'],
      [/email not confirmed/i, 'Confirme seu e-mail (veja a caixa de entrada e o spam) antes de entrar.'],
      [/user already registered|already been registered/i, 'Esse e-mail já tem conta. Use a aba "Entrar".'],
      [/password should be at least|weak.password/i, 'A senha precisa ter pelo menos 8 caracteres.'],
      [/unable to validate email|invalid.*email/i, 'Esse e-mail não parece válido.'],
      [/signups? not allowed|signup.*disabled/i, 'O cadastro de novas contas está desativado neste site.'],
      [/rate limit|too many/i, 'Muitas tentativas seguidas. Espere um minutinho e tente de novo.'],
      [/invalid_code/i, 'Código de convite inválido. Confira com a outra pessoa.'],
      [/couple_full/i, 'Esse cantinho já tem duas pessoas.'],
      [/already_in_couple/i, 'Sua conta já faz parte de um cantinho.'],
      [/not_authenticated|jwt|not authenticated/i, 'Sua sessão expirou. Entre de novo.'],
      [/invalid_date/i, 'A data não pode estar no futuro.'],
      [/row-level security|permission denied/i, 'Você não tem permissão para fazer isso.'],
      [/failed to fetch|networkerror|load failed|network request failed/i, 'Sem conexão com o servidor. Verifique a internet e tente de novo.'],
      [/payload too large|exceeded the maximum|too large/i, 'A imagem é grande demais.'],
      [/mime type|not supported/i, 'Esse tipo de arquivo não é aceito. Use JPG, PNG, WebP ou GIF.']
    ];
    for (var i = 0; i < map.length; i++) if (map[i][0].test(m)) return map[i][1];
    if (code === 'PGRST116') return 'Você não tem permissão para alterar este item (ou ele não existe mais).';
    if (code === '23514') return 'Algum campo ficou grande demais ou inválido.';
    return m || 'Algo deu errado. Tente de novo.';
  };

  api.init = function () {
    if (!api.configured) return false;
    if (!window.supabase || !window.supabase.createClient) return false;
    api.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    return true;
  };

  /* ----- autenticação ----- */
  api.getSession = function () {
    return api.sb.auth.getSession().then(function (r) {
      if (r.error) throw r.error;
      return r.data.session;
    });
  };
  api.signUp = function (email, password, name) {
    return api.sb.auth.signUp({
      email: email, password: password,
      options: { data: { display_name: name }, emailRedirectTo: location.origin + location.pathname }
    }).then(function (r) { if (r.error) throw r.error; return r.data; });
  };
  api.signIn = function (email, password) {
    return api.sb.auth.signInWithPassword({ email: email, password: password })
      .then(function (r) { if (r.error) throw r.error; return r.data; });
  };
  api.signOut = function () {
    return api.sb.auth.signOut().then(function () { api.reset(); });
  };
  api.resetPassword = function (email) {
    return api.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })
      .then(function (r) { if (r.error) throw r.error; });
  };
  api.updatePassword = function (pw) {
    return api.sb.auth.updateUser({ password: pw }).then(function (r) { if (r.error) throw r.error; });
  };
  api.reset = function () {
    api.user = api.profile = api.couple = null;
    api.members = [];
    cache = {}; urlCache = {};
  };

  /* ----- perfil e casal ----- */
  api.loadMe = function () {
    return api.sb.auth.getUser().then(function (r) {
      if (r.error || !r.data.user) throw (r.error || new Error('not_authenticated'));
      api.user = r.data.user;
      return api.sb.from('profiles').select('*').eq('id', api.user.id).maybeSingle();
    }).then(function (r) {
      if (r.error) throw r.error;
      api.profile = r.data;
      api.couple = null; api.members = [];
      if (!r.data || !r.data.couple_id) return null;
      return Promise.all([
        api.sb.from('couples').select('*').eq('id', r.data.couple_id).maybeSingle(),
        api.sb.from('profiles').select('id, display_name').eq('couple_id', r.data.couple_id)
      ]).then(function (x) {
        if (x[0].error) throw x[0].error;
        if (x[1].error) throw x[1].error;
        api.couple = x[0].data;
        api.members = x[1].data || [];
        return api.couple;
      });
    });
  };
  api.createCouple = function (name, startDate) {
    return api.sb.rpc('create_couple', { p_name: name || 'Nosso Cantinho', p_start_date: startDate || null })
      .then(function (r) { if (r.error) throw r.error; return api.loadMe(); });
  };
  api.joinCouple = function (code) {
    return api.sb.rpc('join_couple', { p_code: code })
      .then(function (r) { if (r.error) throw r.error; return api.loadMe(); });
  };
  api.updateCouple = function (patch) {
    return api.sb.from('couples').update(patch).eq('id', api.couple.id).select().single()
      .then(function (r) { if (r.error) throw r.error; api.couple = r.data; return r.data; });
  };
  api.updateDisplayName = function (name) {
    return api.sb.from('profiles').update({ display_name: name }).eq('id', api.user.id).select().single()
      .then(function (r) {
        if (r.error) throw r.error;
        api.profile = r.data;
        api.members = api.members.map(function (m) { return m.id === r.data.id ? { id: m.id, display_name: name } : m; });
      });
  };
  api.nameOf = function (userId) {
    for (var i = 0; i < api.members.length; i++) if (api.members[i].id === userId) return api.members[i].display_name || 'Alguém especial';
    return 'Alguém especial';
  };
  api.partner = function () {
    for (var i = 0; i < api.members.length; i++) if (api.members[i].id !== (api.user && api.user.id)) return api.members[i];
    return null;
  };

  /* ----- tabelas (com cache em memória) ----- */
  var ORDER = {
    events: ['event_date', true], photos: ['created_at', false], letters: ['created_at', false],
    plans: ['created_at', true], wall_notes: ['created_at', false]
  };
  var cache = {};
  api.get = function (table, force) {
    if (!force && cache[table]) return Promise.resolve(cache[table]);
    var o = ORDER[table];
    return api.sb.from(table).select('*').order(o[0], { ascending: o[1] }).then(function (r) {
      if (r.error) throw r.error;
      cache[table] = r.data || [];
      return cache[table];
    });
  };
  api.invalidate = function (table) { if (table) delete cache[table]; else cache = {}; };

  api.insert = function (table, row) {
    return api.sb.from(table).insert(row).select().single().then(function (r) {
      if (r.error) throw r.error;
      api.invalidate(table);
      return r.data;
    });
  };
  api.update = function (table, id, patch) {
    return api.sb.from(table).update(patch).eq('id', id).select().single().then(function (r) {
      if (r.error) throw r.error;
      api.invalidate(table);
      return r.data;
    });
  };
  api.remove = function (table, id) {
    return api.sb.from(table).delete().eq('id', id).select().then(function (r) {
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) throw new Error('Você não tem permissão para excluir este item (ou ele já foi excluído).');
      api.invalidate(table);
    });
  };
  api.setNextPlan = function (id) {
    return api.sb.rpc('set_next_plan', { p_id: id }).then(function (r) {
      if (r.error) throw r.error;
      api.invalidate('plans');
    });
  };

  /* ----- fotos (bucket privado + links assinados) ----- */
  var urlCache = {};
  api.upload = function (blob, ext) {
    var path = api.couple.id + '/' + NC.uid() + '.' + (ext || 'jpg');
    var type = blob.type || (ext === 'png' ? 'image/png' : ext === 'gif' ? 'image/gif' : 'image/jpeg');
    return api.sb.storage.from(BUCKET).upload(path, blob, { contentType: type, cacheControl: '31536000', upsert: false })
      .then(function (r) { if (r.error) throw r.error; return path; });
  };
  api.removeFiles = function (paths) {
    paths = (paths || []).filter(Boolean);
    if (!paths.length) return Promise.resolve();
    return api.sb.storage.from(BUCKET).remove(paths).then(function () { paths.forEach(function (p) { delete urlCache[p]; }); })
      .catch(function () { /* arquivo órfão não impede a operação */ });
  };
  api.urls = function (paths) {
    var now = Date.now();
    var need = [];
    paths.forEach(function (p) {
      if (p && (!urlCache[p] || urlCache[p].exp < now) && need.indexOf(p) < 0) need.push(p);
    });
    if (!need.length) return Promise.resolve();
    return api.sb.storage.from(BUCKET).createSignedUrls(need, 3600).then(function (r) {
      if (r.error) throw r.error;
      (r.data || []).forEach(function (d) {
        if (d && d.signedUrl) urlCache[d.path] = { url: d.signedUrl, exp: Date.now() + 3300 * 1000 };
      });
    });
  };
  api.urlFor = function (path) { return urlCache[path] ? urlCache[path].url : ''; };

  /* Preenche todos os <img data-path="..."> dentro de root com links assinados. */
  api.hydrate = function (root) {
    var imgs = NC.$$('img[data-path]:not([data-ok])', root || document);
    if (!imgs.length) return Promise.resolve();
    return api.urls(imgs.map(function (i) { return i.getAttribute('data-path'); })).then(function () {
      imgs.forEach(function (img) {
        var u = api.urlFor(img.getAttribute('data-path'));
        if (!u) { img.classList.add('broken'); return; }
        img.setAttribute('data-ok', '1');
        img.addEventListener('load', function () { img.classList.add('loaded'); }, { once: true });
        img.addEventListener('error', function () { img.classList.add('broken'); }, { once: true });
        img.src = u;
      });
    }).catch(function () { imgs.forEach(function (i) { i.classList.add('broken'); }); });
  };
})();

/* ===== js/local.js ===== */
/* Modo local: quando o Supabase não está configurado, tudo é guardado neste
   aparelho (dados no localStorage, fotos no IndexedDB). Sem login, sem servidor.
   Troca os métodos de NC.api mantendo o mesmo formato, então as telas não mudam. */
(function () {
  'use strict';
  var NC = (window.NC = window.NC || {});
  var api = NC.api;
  if (!api || api.configured) return;           // com Supabase configurado, nada muda
  api.local = true;

  var KEY = 'nc_local_v1';
  var TABLES = ['events', 'photos', 'letters', 'plans', 'wall_notes'];
  var ORDER = {
    events: ['event_date', true], photos: ['created_at', false], letters: ['created_at', false],
    plans: ['created_at', true], wall_notes: ['created_at', false]
  };
  var COUPLE_FIELDS = ['name', 'start_date', 'welcome_phrase', 'message', 'featured_photo_path'];
  var state = null;
  var storageOk = true;

  function emptyTables() { var t = {}; TABLES.forEach(function (n) { t[n] = []; }); return t; }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function now() { return new Date().toISOString(); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !s.couple || !s.members || s.members.length !== 2) return null;
      TABLES.forEach(function (n) { if (!Array.isArray((s.tables = s.tables || {})[n])) s.tables[n] = []; });
      if (!s.members.some(function (m) { return m.id === s.me; })) s.me = s.members[0].id;
      return s;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) {
      if (storageOk) NC.toast('Não consegui salvar neste navegador. Libere o armazenamento do site ou faça uma cópia de segurança.', 'error');
      storageOk = false;
    }
  }

  /* ----------------------------------------------------------- fotos (IndexedDB) */
  var mem = {};                 // reserva em memória se o IndexedDB não existir
  var dbp = null;
  function idb() {
    if (dbp) return dbp;
    dbp = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('sem indexedDB')); return; }
      var rq = indexedDB.open('nosso-cantinho-local', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('photos'); };
      rq.onsuccess = function () { resolve(rq.result); };
      rq.onerror = function () { reject(rq.error || new Error('erro indexedDB')); };
      rq.onblocked = function () { reject(new Error('indexedDB bloqueado')); };
    });
    return dbp;
  }
  function tx(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction('photos', mode), store = t.objectStore('photos'), out;
        out = fn(store);
        t.oncomplete = function () { resolve(out && 'result' in out ? out.result : undefined); };
        t.onerror = t.onabort = function () { reject(t.error || new Error('erro ao salvar a foto')); };
      });
    });
  }
  function putBlob(path, blob) {
    return tx('readwrite', function (s) { s.put(blob, path); }).catch(function () { mem[path] = blob; });
  }
  function getBlob(path) {
    if (mem[path]) return Promise.resolve(mem[path]);
    return tx('readonly', function (s) { return s.get(path); }).catch(function () { return null; });
  }
  function delBlob(path) {
    delete mem[path];
    return tx('readwrite', function (s) { s.delete(path); }).catch(function () { /* ok */ });
  }
  function allPaths() {
    var p = [];
    TABLES.forEach(function (n) { state.tables[n].forEach(function (r) { if (r.path) p.push(r.path); if (r.photo_path) p.push(r.photo_path); }); });
    if (state.couple.featured_photo_path) p.push(state.couple.featured_photo_path);
    return p;
  }

  /* ----------------------------------------------------------- sessão e casal */
  function publish() {
    var c = state.couple;
    api.couple = clone(c);
    api.members = clone(state.members);
    var me = state.members.filter(function (m) { return m.id === state.me; })[0];
    api.user = { id: me.id, email: '' };
    api.profile = { id: me.id, couple_id: c.id, display_name: me.display_name };
  }
  api.hasLocalData = function () { return !!state; };

  api.init = function () { state = load(); return true; };
  api.getSession = function () { return Promise.resolve(state ? { local: true } : null); };
  api.loadMe = function () {
    if (!state) return Promise.resolve(null);
    publish();
    return Promise.resolve(api.couple);
  };
  api.reset = function () { };
  api.signOut = function () { return Promise.resolve(); };

  /* primeiro acesso: cria o casal com os dois nomes */
  api.setupLocal = function (o) {
    state = {
      v: 1, me: 'a',
      couple: {
        id: 'local-couple', name: o.name || 'Nosso Cantinho', start_date: o.start || null,
        welcome_phrase: null, message: '', featured_photo_path: null, created_at: now()
      },
      members: [{ id: 'a', display_name: o.me }, { id: 'b', display_name: o.partner }],
      tables: emptyTables()
    };
    save();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ok */ }
    publish();
    return Promise.resolve(api.couple);
  };
  api.updateCouple = function (patch) {
    COUPLE_FIELDS.forEach(function (k) { if (k in patch) state.couple[k] = patch[k]; });
    save(); publish();
    return Promise.resolve(api.couple);
  };
  api.updateDisplayName = function (name) {
    state.members.forEach(function (m) { if (m.id === state.me) m.display_name = name; });
    save(); publish();
    return Promise.resolve();
  };
  api.setPartnerName = function (name) {
    state.members.forEach(function (m) { if (m.id !== state.me) m.display_name = name; });
    save(); publish();
    return Promise.resolve();
  };
  /* quem está usando o aparelho agora (define o autor de cartinhas e recados) */
  api.switchMe = function () {
    state.me = state.members.filter(function (m) { return m.id !== state.me; })[0].id;
    save(); publish();
  };

  /* ----------------------------------------------------------- tabelas */
  function rows(table) { return state.tables[table]; }
  api.get = function (table) {
    var o = ORDER[table], asc = o[1];
    var out = clone(rows(table)).sort(function (x, y) {
      var a = x[o[0]] || '', b = y[o[0]] || '';
      return a < b ? (asc ? -1 : 1) : a > b ? (asc ? 1 : -1) : 0;
    });
    return Promise.resolve(out);
  };
  api.invalidate = function () { };

  api.insert = function (table, row) {
    var me = state.me, t = now();
    var r = { id: NC.uid(), couple_id: state.couple.id, created_at: t };
    if (table === 'events') { r.description = ''; r.category = 'especial'; r.repeat_yearly = false; r.is_favorite = false; r.created_by = me; }
    if (table === 'photos') { r.caption = ''; r.description = ''; r.category = 'Momentos'; r.is_favorite = false; r.is_best = false; r.created_by = me; }
    if (table === 'plans') { r.notes = ''; r.done = false; r.memory = ''; r.is_next = false; r.created_by = me; }
    if (table === 'letters') { r.theme = 'rose'; r.updated_at = t; }
    if (table === 'wall_notes') { r.kind = 'frase'; }
    if (table === 'letters' || table === 'wall_notes') r.author_id = me;
    var src = clone(row || {});
    Object.keys(src).forEach(function (k) { if (k !== 'id' && k !== 'couple_id' && k !== 'author_id' && k !== 'created_by') r[k] = src[k]; });
    if (r.title !== undefined && !String(r.title).trim().length) return Promise.reject(new Error('Preencha o título.'));
    rows(table).push(r);
    save();
    return Promise.resolve(clone(r));
  };
  function find(table, id) {
    var list = rows(table);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return i;
    return -1;
  }
  api.update = function (table, id, patch) {
    var i = find(table, id);
    if (i < 0) return Promise.reject(new Error('Esse item não existe mais.'));
    var r = rows(table)[i], src = clone(patch || {});
    Object.keys(src).forEach(function (k) { if (['id', 'couple_id', 'author_id', 'created_by', 'created_at'].indexOf(k) < 0) r[k] = src[k]; });
    if (table === 'letters') r.updated_at = now();
    save();
    return Promise.resolve(clone(r));
  };
  api.remove = function (table, id) {
    var i = find(table, id);
    if (i < 0) return Promise.reject(new Error('Esse item já foi excluído.'));
    rows(table).splice(i, 1);
    save();
    return Promise.resolve();
  };
  api.setNextPlan = function (id) {
    rows('plans').forEach(function (p) { p.is_next = (p.id === id); });
    save();
    return Promise.resolve();
  };

  /* ----------------------------------------------------------- fotos */
  var urlCache = {};
  api.upload = function (blob, ext) {
    var path = 'local/' + NC.uid() + '.' + (ext || 'jpg');
    return putBlob(path, blob).then(function () { return path; });
  };
  api.removeFiles = function (paths) {
    return Promise.all((paths || []).filter(Boolean).map(function (p) {
      if (urlCache[p]) { try { URL.revokeObjectURL(urlCache[p]); } catch (e) { /* ok */ } delete urlCache[p]; }
      return delBlob(p);
    })).then(function () { });
  };
  api.urls = function (paths) {
    return Promise.all(paths.filter(function (p) { return p && !urlCache[p]; }).map(function (p) {
      return getBlob(p).then(function (b) { if (b) urlCache[p] = URL.createObjectURL(b); });
    })).then(function () { });
  };
  api.urlFor = function (path) { return urlCache[path] || ''; };

  /* ----------------------------------------------------------- cópia de segurança */
  function blobToDataURL(b) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(fr.result); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsDataURL(b);
    });
  }
  function dataURLToBlob(u) {
    var m = /^data:([^;,]+)(;base64)?,(.*)$/.exec(u);
    if (!m) throw new Error('foto inválida');
    var bin = atob(decodeURIComponent(m[3])), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: m[1] });
  }
  api.exportBackup = function () {
    var paths = allPaths().filter(function (p, i, a) { return a.indexOf(p) === i; });
    var photos = {};
    return Promise.all(paths.map(function (p) {
      return getBlob(p).then(function (b) { return b ? blobToDataURL(b) : null; }).then(function (u) { if (u) photos[p] = u; });
    })).then(function () {
      var data = JSON.stringify({ app: 'nosso-cantinho', v: 1, saved_at: now(), state: state, photos: photos });
      return new Blob([data], { type: 'application/json' });
    });
  };
  api.importBackup = function (text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { return Promise.reject(new Error('Esse arquivo não é uma cópia do Nosso Cantinho.')); }
    if (!d || d.app !== 'nosso-cantinho' || !d.state || !d.state.couple || !d.state.members || d.state.members.length !== 2) {
      return Promise.reject(new Error('Esse arquivo não é uma cópia do Nosso Cantinho.'));
    }
    var s = d.state;
    TABLES.forEach(function (n) { if (!Array.isArray((s.tables = s.tables || {})[n])) s.tables[n] = []; });
    if (!s.members.some(function (m) { return m.id === s.me; })) s.me = s.members[0].id;
    var old = state ? allPaths() : [];
    var photos = d.photos || {};
    return Promise.all(Object.keys(photos).map(function (p) {
      var b; try { b = dataURLToBlob(photos[p]); } catch (e) { return null; }
      return putBlob(p, b);
    })).then(function () {
      state = s; save(); publish();
      Object.keys(urlCache).forEach(function (p) { try { URL.revokeObjectURL(urlCache[p]); } catch (e) { /* ok */ } });
      urlCache = {};
      old.forEach(function (p) { if (!(p in photos)) delBlob(p); });
    });
  };
})();

/* Página inicial: Nossa História, contador, mensagem, foto favorita e atalhos. */

  function coupleTitle() {
    var c = api.couple;
    if (c.name && c.name !== 'Nosso Cantinho') return c.name;

    if (total > 0 && t.getDate() === s.getDate() && t.getMonth() === s.getMonth()) {
      badge = '<p class="today-badge">' + icon('heart', { fill: true, size: 16 }) + ' Hoje é o nosso aniversário de namoro! Feliz ' + d.years + (d.years === 1 ? ' ano' : ' anos') + ' de nós.</p>';
    } else if (total > 0 && t.getDate() === s.getDate()) {
      badge = '<p class="today-badge">' + icon('heart', { fill: true, size: 16 }) + ' Hoje é dia de comemorar: mais um mês de nós!</p>';
    }

      return '<div class="count-tile tilt" data-tilt="12" data-hearts>' +
        '<span class="count-num" data-to="' + n + '">' + n + '</span>' +
        '<span class="count-label">' + (n === 1 ? one : many) + '</span></div>';
    }
    return '<div class="counter" aria-label="Tempo de namoro">' +
      '<div class="count-tiles">' + tile(d.years, 'ano', 'anos') + tile(d.months, 'mês', 'meses') + tile(d.days, 'dia', 'dias') + '</div>' +
      '<p class="count-total"><strong>' + total.toLocaleString('pt-BR') + '</strong> ' + (total === 1 ? 'dia' : 'dias') + ' juntos <span class="count-live" id="live"></span></p>' +
      badge + '</div>';
  }

  function tickLive() {
    var c = api.couple;
    var el = $('#live');

    if (NC.todayStr() !== lastDay) { var box = $('#counter-box'); if (box) { box.innerHTML = counterHTML(); animateCounts(); } }
    var ms = Date.now() - NC.parseDate(c.start_date).getTime();
    if (ms < 0) { el.textContent = ''; return; }
    var h = Math.floor(ms / 36e5), mi = Math.floor(ms / 6e4) % 60, se = Math.floor(ms / 1e3) % 60;

  }
  function animateCounts() {

  }

  function nextEventCard(events) {
    var best = null;
    events.forEach(function (e) {
      var d = NC.nextOccurrence(e);
      if (d && (!best || d < best.date)) best = { ev: e, date: d };
    });
    if (!best) {
      return '<article class="mini-card glass"><h3>' + icon('calendar', { size: 18 }) + ' Próximo evento</h3>' +
        '<p class="muted">Nenhuma data marcada ainda.</p><a class="btn btn-ghost" href="#/calendario">Abrir o calendário</a></article>';
    }
    var cat = NC.catMeta(best.ev.category), n = NC.daysBetween(NC.today(), best.date);

      '<div class="next-ev"><span class="heart-dot big" style="color:' + cat.color + '">' + NC.heartSVG('currentColor') + '</span>' +
      '<div><strong class="next-title">' + esc(best.ev.title) + '</strong>' +

      '<p class="big-countdown"><span>' + (n === 0 ? 'Hoje!' : n) + '</span> ' + (n === 0 ? '' : (n === 1 ? 'dia para chegar' : 'dias para chegar')) + '</p>' +

  var view = (NC.views.home = {
