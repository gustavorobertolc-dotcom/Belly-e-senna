/* Aplicativo: telas de entrada, navegação, tema, música e configurações. */
(function () {
  'use strict';
  var NC = window.NC, api = NC.api, $ = NC.$, esc = NC.esc, icon = NC.icon;
  var app = (NC.app = {});

  var ROUTES = [
    { id: 'inicio', label: 'Início', icon: 'home', view: 'home' },
    { id: 'calendario', label: 'Calendário', icon: 'calendar', view: 'calendar' },
    { id: 'album', label: 'Álbum', icon: 'image', view: 'album' },
    { id: 'cartinhas', label: 'Cartinhas', icon: 'mail', view: 'letters' },
    { id: 'planos', label: 'Planos', icon: 'list', view: 'plans' },
    { id: 'mural', label: 'Mural', icon: 'note', view: 'wall' }
  ];
  var st = { booted: false, appVisible: false, recovery: false, token: 0, current: null, routeId: null };

  /* Coração 3D feito só com CSS (usado nas telas de entrada e como reserva sem WebGL) */
  NC.heart3d = function (size, sway) {
    var layers = '';
    var n = 11;
    for (var i = 0; i < n; i++) {
      var z = (i - (n - 1) / 2) * 3.2;
      var t = i / (n - 1);
      var l = 24 + t * 30;
      layers += '<i style="--z:' + z.toFixed(1) + 'px;--c:hsl(338 82% ' + l.toFixed(0) + '%)"></i>';
    }
    return '<div class="heart3d' + (sway ? ' sway' : '') + '" style="--s:' + (size || 120) + 'px" aria-hidden="true">' + layers + '</div>';
  };

  /* ---------------------------------------------------------------- tema */
  var theme = (app.theme = {
    get: function () { return document.documentElement.getAttribute('data-theme') || 'dark'; },
    set: function (t) {
      document.documentElement.setAttribute('data-theme', t);
      NC.safeStorage.set('nc_theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#f6e9fb' : '#1a0830');
      if (NC.bg && NC.bg.setTheme) NC.bg.setTheme(t);
      paintThemeBtn();
    },
    toggle: function () { theme.set(theme.get() === 'dark' ? 'light' : 'dark'); }
  });
  function paintThemeBtn() {
    var b = $('#btn-theme');
    if (!b) return;
    var dark = theme.get() === 'dark';
    b.innerHTML = icon(dark ? 'sun' : 'moon');
    b.title = dark ? 'Mudar para o tema claro' : 'Mudar para o tema escuro';
  }

  /* ------------------------------------------------------ troca de telas */
  function showScreen(html, bind) {
    var root = $('#screen-root');
    $('#app').hidden = true;
    st.appVisible = false;
    if (NC.bg) NC.bg.setAnchor(null);
    if (NC.views.home && NC.views.home.destroy) NC.views.home.destroy();
    root.hidden = false;
    root.innerHTML = html;
    window.scrollTo(0, 0);
    if (bind) bind(root);
    hideSplash();
  }
  function hideSplash() {
    var s = $('#splash');
    if (!s || s.classList.contains('hide')) return;
    s.classList.add('hide');
    setTimeout(function () { s.remove(); }, 700);
  }

  function field(label, name, attrs, hint) {
    return '<label class="field"><span class="field-label">' + label + '</span>' +
      '<input name="' + name + '" ' + (attrs || '') + '>' +
      '<span class="field-error" data-error-for="' + name + '" role="alert"></span>' +
      (hint ? '<span class="field-hint">' + hint + '</span>' : '') + '</label>';
  }

  /* ------------------------------------------------- tela: falta configurar */
  function setupScreen() {
    showScreen(
      '<section class="auth-card glass setup-card">' +
        '<div class="auth-hero">' + NC.heart3d(86) + '<h1 class="script">Nosso Cantinho</h1></div>' +
        '<h2 class="auth-title">Falta só ligar o Supabase</h2>' +
        '<p class="muted">O site já está pronto. Para guardar fotos, cartas e datas com segurança, ele precisa do seu projeto Supabase (gratuito):</p>' +
        '<ol class="setup-steps">' +
          '<li>Crie um projeto em <strong>supabase.com</strong>.</li>' +
          '<li>Em <strong>SQL Editor</strong>, cole o arquivo <code>supabase/schema.sql</code> e clique em <strong>Run</strong>.</li>' +
          '<li>Em <strong>Project Settings → API</strong>, copie o <strong>Project URL</strong> e a chave <strong>anon public</strong>.</li>' +
          '<li>Cole os dois valores no arquivo <code>js/config.js</code> e recarregue esta página.</li>' +
        '</ol>' +
        '<p class="muted small">O passo a passo completo (incluindo e-mail de confirmação e como publicar) está no <code>README.md</code>.</p>' +
      '</section>');
  }

  /* ------------------------------------- tela: primeiro acesso (modo local) */
  function localWelcome() {
    showScreen(
      '<section class="auth-card glass">' +
        '<div class="auth-hero">' + NC.heart3d(96) +
          '<h1 class="script">Nosso Cantinho</h1>' +
          '<p class="muted">Um lugar só nosso, para guardar a nossa história.</p></div>' +
        '<form id="welcome-form" novalidate autocomplete="off">' +
          field('Seu nome', 'me', 'type="text" maxlength="40" placeholder="Como ela(e) te chama" required') +
          field('Nome da sua pessoa especial', 'partner', 'type="text" maxlength="40" placeholder="Como você chama ela(e)" required') +
          field('Como vocês querem se chamar?', 'cname', 'type="text" maxlength="60" placeholder="Ex.: Ana & Bia"', 'Opcional. Aparece na página inicial.') +
          field('Data de início do namoro', 'start', 'type="date" max="' + NC.todayStr() + '"', 'Opcional agora — vocês podem mudar depois.') +
          '<p class="form-error" id="welcome-msg" role="alert"></p>' +
          '<button class="btn btn-primary btn-block" type="submit">Começar nosso cantinho</button>' +
        '</form>' +
        '<p class="muted small center">' + icon('lock', { size: 14 }) + ' Tudo fica salvo só neste aparelho. Use o menu para fazer uma cópia de segurança.</p>' +
      '</section>',
      function (root) {
        var form = $('#welcome-form', root);
        form.addEventListener('submit', function (ev) {
          ev.preventDefault(); NC.clearErrors(form);
          var me = form.elements.me.value.trim(), partner = form.elements.partner.value.trim(), start = form.elements.start.value, ok = true;
          if (!me) { NC.fieldError(form, 'me', 'Como podemos te chamar?'); ok = false; }
          if (!partner) { NC.fieldError(form, 'partner', 'Escreva o nome da sua pessoa especial.'); ok = false; }
          if (start && start > NC.todayStr()) { NC.fieldError(form, 'start', 'A data não pode estar no futuro.'); ok = false; }
          if (!ok) return;
          var wm = $('#welcome-msg', root); wm.textContent = '';
          Promise.resolve().then(function () {
            return api.setupLocal({ me: me, partner: partner, name: form.elements.cname.value.trim() || me + ' & ' + partner, start: start || null });
          }).then(function () { enterApp(); NC.toast('Bem-vindos ao nosso cantinho! ❤️', 'success'); })
            .catch(function (e) { wm.textContent = 'Não consegui avançar: ' + ((e && e.message) || e) + ' — me mande esta frase.'; });
        });
      });
  }

  /* ------------------------------ cópia de segurança (modo local) */
  app.openBackup = function () {
    NC.modal({
      title: 'Cópia de segurança',
      size: 'sm',
      html:
        '<p class="muted">Tudo o que vocês guardam fica só neste aparelho. Se o navegador for limpo, trocar de celular ou desinstalar, as lembranças somem. Salve uma cópia de vez em quando e guarde o arquivo num lugar seguro.</p>' +
        '<div class="form-actions" style="flex-direction:column;align-items:stretch">' +
          '<button type="button" class="btn btn-primary" id="bk-save">' + icon('upload', { size: 16 }) + ' Salvar cópia (arquivo)</button>' +
          '<button type="button" class="btn btn-ghost" id="bk-load">' + icon('image', { size: 16 }) + ' Restaurar de um arquivo</button>' +
          '<input type="file" id="bk-file" accept=".json,application/json" hidden>' +
        '</div>' +
        '<p class="form-error" id="bk-msg" role="alert"></p>',
      onMount: function (ctl) {
        var msg = $('#bk-msg', ctl.el), file = $('#bk-file', ctl.el);
        $('#bk-save', ctl.el).addEventListener('click', function () {
          var b = $('#bk-save', ctl.el); NC.busy(b, true, 'Preparando…'); msg.textContent = '';
          api.exportBackup().then(function (blob) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'nosso-cantinho-' + NC.todayStr() + '.json';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
            NC.busy(b, false); NC.toast('Cópia salva! Guarde esse arquivo com carinho.', 'success');
          }).catch(function (e) { NC.busy(b, false); msg.textContent = api.errorText(e); });
        });
        $('#bk-load', ctl.el).addEventListener('click', function () { file.click(); });
        file.addEventListener('change', function () {
          var f = file.files && file.files[0];
          if (!f) return;
          NC.confirm('Isso substitui tudo o que existe neste aparelho pelo conteúdo da cópia. Continuar?', { title: 'Restaurar cópia', okText: 'Restaurar', danger: false }).then(function (yes) {
            if (!yes) { file.value = ''; return; }
            return f.text().then(function (t) { return api.importBackup(t); }).then(function () {
              ctl.close(); NC.toast('Tudo restaurado ❤️', 'success'); paintUser(); route();
            }).catch(function (e) { file.value = ''; msg.textContent = api.errorText(e); });

  /* ---------------------------------------------------------- tela: entrar */
  function authScreen(mode) {
    mode = mode === 'signup' ? 'signup' : 'login';
    showScreen(
      '<section class="auth-card glass">' +
        '<div class="auth-hero">' + NC.heart3d(96) +
          '<h1 class="script">Nosso Cantinho</h1>' +
          '<p class="muted">Um lugar só nosso, para guardar a nossa história.</p></div>' +
        '<div class="tabs" role="tablist">' +
          '<button type="button" role="tab" class="tab' + (mode === 'login' ? ' active' : '') + '" data-mode="login" aria-selected="' + (mode === 'login') + '">Entrar</button>' +
          '<button type="button" role="tab" class="tab' + (mode === 'signup' ? ' active' : '') + '" data-mode="signup" aria-selected="' + (mode === 'signup') + '">Criar conta</button>' +
        '</div>' +
        '<form id="auth-form" novalidate autocomplete="on">' +
          (mode === 'signup' ? field('Seu nome', 'name', 'type="text" maxlength="40" autocomplete="given-name" placeholder="Como ela(e) te chama" required') : '') +
          field('E-mail', 'email', 'type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" required') +
          field('Senha', 'password', 'type="password" autocomplete="' + (mode === 'signup' ? 'new-password' : 'current-password') + '" placeholder="' + (mode === 'signup' ? 'Pelo menos 8 caracteres' : 'Sua senha') + '" required', null) +
          (mode === 'signup' ? field('Repita a senha', 'password2', 'type="password" autocomplete="new-password" required') : '') +
          '<p class="form-error" id="auth-msg" role="alert" aria-live="polite"></p>' +
          '<button class="btn btn-primary btn-block" type="submit">' + (mode === 'signup' ? 'Criar minha conta' : 'Entrar no nosso cantinho') + '</button>' +
          (mode === 'login' ? '<button type="button" class="link-btn" id="forgot">Esqueci minha senha</button>' : '') +
        '</form>' +
        '<p class="muted small center">' + icon('lock', { size: 14 }) + ' Só vocês dois têm acesso. Cada conta é individual.</p>' +
      '</section>',
      function (root) {
        var form = $('#auth-form', root), msg = $('#auth-msg', root);
        root.querySelectorAll('.tab').forEach(function (t) {
          t.addEventListener('click', function () { authScreen(t.getAttribute('data-mode')); });
        });
        var forgot = $('#forgot', root);
        if (forgot) forgot.addEventListener('click', function () {
          var email = form.elements.email.value.trim();
          NC.clearErrors(form); msg.textContent = '';
          if (!/^\S+@\S+\.\S+$/.test(email)) { NC.fieldError(form, 'email', 'Digite seu e-mail aqui em cima para enviarmos o link.'); form.elements.email.focus(); return; }
          api.resetPassword(email).then(function () {
            msg.className = 'form-ok'; msg.textContent = 'Pronto! Se esse e-mail tiver conta, você vai receber um link para criar uma senha nova.';
          }).catch(function (e) { msg.className = 'form-error'; msg.textContent = api.errorText(e); });
        });
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          NC.clearErrors(form); msg.className = 'form-error'; msg.textContent = '';
          var email = form.elements.email.value.trim(), pw = form.elements.password.value;
          var ok = true;
          if (!/^\S+@\S+\.\S+$/.test(email)) { NC.fieldError(form, 'email', 'Digite um e-mail válido.'); ok = false; }
          if (!pw) { NC.fieldError(form, 'password', 'Digite a senha.'); ok = false; }
          var name = '';
          if (mode === 'signup') {
            name = form.elements.name.value.trim();
            if (!name) { NC.fieldError(form, 'name', 'Como podemos te chamar?'); ok = false; }
            if (pw && pw.length < 8) { NC.fieldError(form, 'password', 'Use pelo menos 8 caracteres.'); ok = false; }
            if (pw !== form.elements.password2.value) { NC.fieldError(form, 'password2', 'As senhas não são iguais.'); ok = false; }
          }
          if (!ok) return;
          var btn = $('button[type=submit]', form);
          NC.busy(btn, true, mode === 'signup' ? 'Criando…' : 'Entrando…');
          var p = mode === 'signup' ? api.signUp(email, pw, name) : api.signIn(email, pw);
          p.then(function (data) {
            if (mode === 'signup' && !(data && data.session)) {
              NC.busy(btn, false);
              msg.className = 'form-ok';
              msg.textContent = 'Conta criada! Enviamos um e-mail de confirmação — abra o link e depois volte aqui para entrar.';
              return;
            }
            return app.afterAuth();
          }).catch(function (e) {
            NC.busy(btn, false);
            msg.textContent = api.errorText(e);
          });
        });
      });
  }

  /* ------------------------------------------ tela: nova senha (recuperação) */
  function recoveryScreen() {
    showScreen(
      '<section class="auth-card glass">' +
        '<div class="auth-hero">' + NC.heart3d(80) + '<h1 class="script">Nova senha</h1></div>' +
        '<form id="rec-form" novalidate>' +
          field('Nova senha', 'password', 'type="password" autocomplete="new-password" placeholder="Pelo menos 8 caracteres" required') +
          field('Repita a nova senha', 'password2', 'type="password" autocomplete="new-password" required') +
          '<p class="form-error" id="rec-msg" role="alert"></p>' +
          '<button class="btn btn-primary btn-block" type="submit">Salvar nova senha</button>' +
        '</form></section>',
      function (root) {
        var form = $('#rec-form', root), msg = $('#rec-msg', root);
        form.addEventListener('submit', function (ev) {
          ev.preventDefault(); NC.clearErrors(form); msg.textContent = '';
          var a = form.elements.password.value, b = form.elements.password2.value, ok = true;
          if (a.length < 8) { NC.fieldError(form, 'password', 'Use pelo menos 8 caracteres.'); ok = false; }
          if (a !== b) { NC.fieldError(form, 'password2', 'As senhas não são iguais.'); ok = false; }
          if (!ok) return;
          var btn = $('button[type=submit]', form); NC.busy(btn, true, 'Salvando…');
          api.updatePassword(a).then(function () {
            st.recovery = false; NC.toast('Senha atualizada!', 'success'); return app.afterAuth();
          }).catch(function (e) { NC.busy(btn, false); msg.textContent = api.errorText(e); });
        });
      });
  }

  /* ------------------------------------------------ tela: criar/entrar no casal */
  function coupleScreen() {
    var name = (api.profile && api.profile.display_name) || '';
    showScreen(
      '<section class="couple-wrap">' +
        '<header class="couple-head">' + NC.heart3d(84) +
          '<h1 class="script">Olá' + (name ? ', ' + esc(name) : '') + '!</h1>' +
          '<p class="muted">Agora falta ligar a sua conta à da outra pessoa. Uma de vocês cria o cantinho e a outra entra com o código de convite.</p></header>' +
        '<div class="couple-grid">' +
          '<form class="glass card-pad" id="create-form" novalidate>' +
            '<h2 class="auth-title">' + icon('heart', { fill: true, size: 18 }) + ' Criar nosso cantinho</h2>' +
            field('Como vocês querem se chamar?', 'cname', 'type="text" maxlength="60" placeholder="Ex.: Ana & Bia"', 'Opcional. Aparece na página inicial.') +
            field('Data de início do namoro', 'start', 'type="date" max="' + NC.todayStr() + '"', 'Opcional agora — vocês podem mudar depois.') +
            '<p class="form-error" id="create-msg" role="alert"></p>' +
            '<button class="btn btn-primary btn-block" type="submit">Criar e gerar código</button>' +
          '</form>' +
          '<form class="glass card-pad" id="join-form" novalidate>' +
            '<h2 class="auth-title">' + icon('key', { size: 18 }) + ' Tenho um código</h2>' +
            field('Código de convite', 'code', 'type="text" maxlength="14" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXXX-XXXXX" class="code-input"', 'Peça para a outra pessoa abrir o menu da conta e copiar o código.') +
            '<p class="form-error" id="join-msg" role="alert"></p>' +
            '<button class="btn btn-ghost btn-block" type="submit">Entrar no cantinho</button>' +
          '</form>' +
        '</div>' +
        '<p class="center"><button type="button" class="link-btn" id="signout">Sair desta conta</button></p>' +
      '</section>',
      function (root) {
        var cf = $('#create-form', root), jf = $('#join-form', root);
        cf.addEventListener('submit', function (ev) {
          ev.preventDefault(); NC.clearErrors(cf);
          var msg = $('#create-msg', root); msg.textContent = '';
          var start = cf.elements.start.value;
          if (start && start > NC.todayStr()) { NC.fieldError(cf, 'start', 'A data não pode estar no futuro.'); return; }
          var btn = $('button[type=submit]', cf); NC.busy(btn, true, 'Criando…');
          api.createCouple(cf.elements.cname.value.trim() || 'Nosso Cantinho', start || null).then(function () {
            enterApp(); setTimeout(function () { app.showInvite(true); }, 600);
          }).catch(function (e) { NC.busy(btn, false); msg.textContent = api.errorText(e); });
        });
        var codeInput = jf.elements.code;
        codeInput.addEventListener('input', function () {
          var v = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
          codeInput.value = v.length > 5 ? v.slice(0, 5) + '-' + v.slice(5) : v;
        });
        jf.addEventListener('submit', function (ev) {
          ev.preventDefault(); NC.clearErrors(jf);
          var msg = $('#join-msg', root); msg.textContent = '';
          var raw = codeInput.value.replace(/[^A-Za-z0-9]/g, '');
          if (raw.length !== 10) { NC.fieldError(jf, 'code', 'O código tem 10 letras e números.'); return; }
          var btn = $('button[type=submit]', jf); NC.busy(btn, true, 'Entrando…');
          api.joinCouple(raw).then(function () {
            enterApp(); NC.toast('Bem-vindos ao nosso cantinho! ❤️', 'success');
          }).catch(function (e) { NC.busy(btn, false); msg.textContent = api.errorText(e); });
        });
        $('#signout', root).addEventListener('click', function () { api.signOut().then(function () { authScreen('login'); }); });
      });
  }

  app.afterAuth = function () {
    return api.loadMe().then(function () {
      if (!api.couple) coupleScreen(); else enterApp();
    });
  };

  /* ------------------------------------------------------------ convite */
  app.showInvite = function (fresh) {
    if (!api.couple) return;
    var full = api.members.length >= 2;
    var code = api.couple.invite_code || '';
    var pretty = code.slice(0, 5) + '-' + code.slice(5);
    NC.modal({
      title: full ? 'Vocês dois já estão aqui ❤️' : (fresh ? 'Cantinho criado! 🎉' : 'Código de convite'),
      size: 'sm',
      html: full
        ? '<p class="muted">O cantinho está completo: só as duas contas têm acesso e o código de convite já não funciona para mais ninguém.</p>'
        : '<p class="muted">Envie este código para a sua pessoa especial. Ela cria uma conta e escolhe <strong>“Tenho um código”</strong>. Funciona uma única vez — assim que ela entrar, o cantinho fecha para outras pessoas.</p>' +
          '<div class="invite-code" id="invite-code">' + esc(pretty) + '</div>' +
          '<div class="form-actions"><button type="button" class="btn btn-primary" id="copy-code">' + icon('copy', { size: 16 }) + ' Copiar código</button></div>',
      onMount: function (c) {
        var b = $('#copy-code', c.el);
        if (!b) return;
        b.addEventListener('click', function () {
          var done = function () { NC.toast('Código copiado!', 'success'); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(pretty).then(done, function () { NC.toast('Copie manualmente: ' + pretty); });
          else NC.toast('Copie manualmente: ' + pretty);
        });
      }
    });
  };

  /* -------------------------------------------------------- configurações */
  app.openSettings = function () {
    var c = api.couple, me = api.profile || {};
    NC.modal({
      title: 'Nosso cantinho',
      html:
        '<form id="set-form" class="form" novalidate>' +
          field('Como vocês se chamam?', 'name', 'type="text" maxlength="60" value="' + esc(c.name) + '" placeholder="Ex.: Ana & Bia"') +
          field('Data de início do namoro', 'start', 'type="date" max="' + NC.todayStr() + '" value="' + esc(c.start_date || '') + '"', 'É a partir dela que contamos o nosso tempo juntos.') +
          field('Frase de boas-vindas', 'phrase', 'type="text" maxlength="200" value="' + esc(c.welcome_phrase || '') + '" placeholder="Uma frase que apareça quando vocês chegarem"') +
          '<label class="field"><span class="field-label">Mensagem para ela(e)</span>' +
            '<textarea name="message" rows="4" maxlength="2000" placeholder="Escreva algo do coração…">' + esc(c.message || '') + '</textarea>' +
            '<span class="field-error" data-error-for="message" role="alert"></span></label>' +
          field('Seu nome', 'me', 'type="text" maxlength="40" value="' + esc(me.display_name || '') + '"') +
          (api.local ? field('Nome da sua pessoa especial', 'partnername', 'type="text" maxlength="40" value="' + esc((api.partner() || {}).display_name || '') + '"') : '') +
          '<p class="form-error" id="set-msg" role="alert"></p>' +
          '<div class="form-actions"><button type="button" class="btn btn-ghost" data-close>Cancelar</button>' +
          '<button type="submit" class="btn btn-primary">Salvar</button></div>' +
        '</form>',
      onMount: function (ctl) {
        var form = $('#set-form', ctl.el), msg = $('#set-msg', ctl.el);
        form.addEventListener('submit', function (ev) {
          ev.preventDefault(); NC.clearErrors(form); msg.textContent = '';
          var start = form.elements.start.value, ok = true;
          var nm = form.elements.name.value.trim(), mine = form.elements.me.value.trim();
          if (!nm) { NC.fieldError(form, 'name', 'Escolha um nome para o casal.'); ok = false; }
          if (!mine) { NC.fieldError(form, 'me', 'Escreva o seu nome.'); ok = false; }
          if (api.local && !form.elements.partnername.value.trim()) { NC.fieldError(form, 'partnername', 'Escreva o nome da sua pessoa especial.'); ok = false; }
          if (start && start > NC.todayStr()) { NC.fieldError(form, 'start', 'A data não pode estar no futuro.'); ok = false; }
          if (!ok) return;
          var btn = $('button[type=submit]', form); NC.busy(btn, true, 'Salvando…');
          var jobs = [api.updateCouple({
            name: nm, start_date: start || null,
            welcome_phrase: form.elements.phrase.value.trim() || null,
            message: form.elements.message.value.trim()
          })];
          if (mine !== (me.display_name || '')) jobs.push(api.updateDisplayName(mine));
          if (api.local && form.elements.partnername.value.trim() !== ((api.partner() || {}).display_name || '')) {
            jobs.push(api.setPartnerName(form.elements.partnername.value.trim()));
          }
          Promise.all(jobs).then(function () {
            ctl.close(); NC.toast('Salvo com carinho ❤️', 'success'); paintUser(); route();
          }).catch(function (e) { NC.busy(btn, false); msg.textContent = api.errorText(e); });
        });
      }
    });
  };

  /* ---------------------------------------------------------------- app */
  function buildNav() {
    var d = '', m = '';
    ROUTES.forEach(function (r) {
      d += '<a class="nav-link" href="#/' + r.id + '" data-route="' + r.id + '">' + icon(r.icon, { size: 18 }) + '<span>' + r.label + '</span></a>';
      m += '<a class="nav-tab" href="#/' + r.id + '" data-route="' + r.id + '" aria-label="' + r.label + '">' + icon(r.icon, { size: 22 }) + '<span>' + r.label + '</span></a>';
    });
    $('#nav-desktop').innerHTML = d;
    $('#nav-mobile').innerHTML = m;
  }
  function paintMusicBtn() {
    var b = $('#btn-music'), on = NC.music.isOn();
    b.innerHTML = icon(on ? 'music' : 'musicOff');
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? 'Desligar música romântica' : 'Ligar música romântica');
    b.title = on ? 'Desligar a música' : 'Ligar a música romântica';
    b.classList.toggle('is-on', on);
  }
  function paintUser() {
    var b = $('#btn-user');
    var nm = (api.profile && api.profile.display_name) || '?';
    b.innerHTML = '<span class="avatar">' + esc(nm.trim().charAt(0).toUpperCase() || '?') + '</span>';
    var pop = $('#user-pop');
    var partner = api.partner();
    if (api.local) {
      var pn = (partner && partner.display_name) || 'sua pessoa';
      pop.innerHTML =
        '<div class="user-pop-head"><strong>' + esc(nm) + '</strong><span class="muted small">Usando agora · com ' + esc(pn) + '</span></div>' +
        '<button type="button" class="menu-item" data-act="switch">' + icon('users', { size: 16 }) + ' Agora é ' + esc(pn) + ' usando</button>' +
        '<button type="button" class="menu-item" data-act="settings">' + icon('edit', { size: 16 }) + ' Editar nosso cantinho</button>' +
        '<button type="button" class="menu-item" data-act="backup">' + icon('upload', { size: 16 }) + ' Cópia de segurança</button>';
      return;
    }
    pop.innerHTML =
      '<div class="user-pop-head"><strong>' + esc(nm) + '</strong><span class="muted small">' + esc((api.user && api.user.email) || '') + '</span>' +
      '<span class="muted small">' + (partner ? 'Com ' + esc(partner.display_name || 'sua pessoa especial') : 'Aguardando a outra pessoa entrar') + '</span></div>' +
      '<button type="button" class="menu-item" data-act="settings">' + icon('edit', { size: 16 }) + ' Editar nosso cantinho</button>' +
      '<button type="button" class="menu-item" data-act="invite">' + icon('key', { size: 16 }) + ' Código de convite</button>' +
      '<button type="button" class="menu-item" data-act="logout">' + icon('logout', { size: 16 }) + ' Sair</button>';
  }
  var appBound = false;
  function bindApp() {
    if (appBound) return;
    appBound = true;
    $('#btn-theme').addEventListener('click', theme.toggle);
    $('#btn-surprise').innerHTML = icon('gift');
    $('#btn-surprise').addEventListener('click', function () { NC.surprise.open(); });
    var mb = $('#btn-music');
    if (!NC.music.supported) mb.hidden = true;
    mb.addEventListener('click', function () { NC.music.toggle(); });
    NC.music.onChange(paintMusicBtn);
    var pop = $('#user-pop'), ub = $('#btn-user');
    function closePop() { pop.hidden = true; ub.setAttribute('aria-expanded', 'false'); }
    ub.addEventListener('click', function (e) {
      e.stopPropagation();
      pop.hidden = !pop.hidden;
      ub.setAttribute('aria-expanded', String(!pop.hidden));
    });
    document.addEventListener('click', function (e) { if (!pop.contains(e.target)) closePop(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });
    pop.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      closePop();
      var act = b.getAttribute('data-act');
      if (act === 'settings') app.openSettings();
      else if (act === 'invite') app.showInvite(false);
      else if (act === 'backup') app.openBackup();
      else if (act === 'switch') {
        api.switchMe(); paintUser(); route();
        NC.toast('Agora quem está usando é ' + api.profile.display_name + ' ❤️');
      }
      else if (act === 'logout') {
        NC.music.stop();
        api.signOut().then(function () { authScreen('login'); });
      }
    });
    window.addEventListener('hashchange', function () { if (st.appVisible) route(); });
  }

  function enterApp() {
    $('#screen-root').hidden = true;
    $('#screen-root').innerHTML = '';
    $('#app').hidden = false;
    st.appVisible = true;
    buildNav(); bindApp(); paintThemeBtn(); paintMusicBtn(); paintUser();
    route();
    hideSplash();
  }

  function route() {
    var m = /^#\/([a-z]+)/.exec(location.hash || '');
    var r = ROUTES.filter(function (x) { return x.id === (m && m[1]); })[0] || ROUTES[0];
    if (st.current && st.current.destroy) { try { st.current.destroy(); } catch (e) { /* ok */ } }
    NC.bg && NC.bg.setAnchor(null);
    var view = NC.views[r.view];
    st.current = view; st.routeId = r.id;
    var my = ++st.token;
    /* um <main> novo a cada troca de página: descarta ouvintes de eventos antigos */
    var oldRoot = $('#view');
    var root = oldRoot.cloneNode(false);
    oldRoot.parentNode.replaceChild(root, oldRoot);
    root.className = 'view view-' + r.id;
    root.innerHTML = '<div class="view-loading"><span class="spinner" aria-label="Carregando"></span></div>';
    NC.$$('[data-route]').forEach(function (a) {
      var on = a.getAttribute('data-route') === r.id;
      a.classList.toggle('active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    var ctx = { alive: function () { return my === st.token; } };
    Promise.resolve().then(function () { return view.render(root, ctx); }).then(function () {
      if (!ctx.alive()) return;
      root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter');
      if (api.hydrate) api.hydrate(root);
    }).catch(function (err) {
      if (!ctx.alive()) return;
      root.innerHTML =
        '<div class="empty glass"><h2>Ops, não deu para carregar</h2><p class="muted">' + esc(api.errorText(err)) + '</p>' +
        '<button class="btn btn-primary" id="retry">Tentar de novo</button></div>';
      $('#retry', root).addEventListener('click', route);
    });
  }
  app.refresh = route;
  app.isCurrent = function (id) { return st.routeId === id; };

  /* --------------------------------------------------------------- boot */
  function boot() {
    NC.fx.init();
    NC.bg.init();
    paintThemeBtn();

    if (api.local) {
      api.init();
      Promise.resolve(api.hasLocalData() ? api.loadMe().then(enterApp) : localWelcome())
        .catch(function (e) { NC.toast(api.errorText(e), 'error'); })
        .then(function () { st.booted = true; hideSplash(); });
      return;
    }

    if (!api.configured || !api.init()) {
      if (api.configured && !api.sb) {
        showScreen('<section class="auth-card glass"><h2 class="auth-title">Não consegui carregar o Supabase</h2><p class="muted">Verifique sua conexão com a internet e recarregue a página.</p></section>');
        return;
      }
      setupScreen();
      return;
    }

    api.sb.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') {
        st.recovery = true;
        if (st.booted) recoveryScreen();
      } else if (event === 'SIGNED_OUT' && st.booted && st.appVisible) {
        api.reset(); NC.music.stop(); authScreen('login');
      }
    });

    api.getSession().then(function (session) {
      if (st.recovery) { recoveryScreen(); return; }
      if (!session) { authScreen('login'); return; }
      return app.afterAuth();
    }).catch(function (e) {
      authScreen('login');
      NC.toast(api.errorText(e), 'error');
    }).then(function () { st.booted = true; hideSplash(); });
  }

  document.addEventListener('DOMContentLoaded', boot);
})();

  </script>
</body>
</html>
